<style>
/* ================================================================
 * GAME HACK 共通UI（ここから）— 全ゲームで同じものをコピーして使う
 * 世界観: 業務帳票。紙 × 墨 × 朱（ハンコの赤）。
 * - 朱は「判子」と「失敗」にだけ使う。ボタンや装飾には使わない
 * - 角丸は 2px まで。影・グラデーション・絵文字は使わない
 * ================================================================ */
:root{
  --paper:#F3EFE4; --paper2:#E8E1CF; --ink:#22201C; --ink2:#5E584D; --rule:#CDC3AC; --shu:#C8372D;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDGothic","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--scene,#2b2a27);font-family:var(--font);color:var(--ink);-webkit-text-size-adjust:100%}
#wrap{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
/* HUD: 帳票の見出し帯。左=どこ / 中=いまの数値 / 右=一時停止 */
#hud{position:absolute;left:0;right:0;top:0;padding-top:var(--safe-t);background:var(--paper);border-bottom:1px solid var(--ink);display:none;grid-template-columns:1fr auto 52px;align-items:center;height:calc(48px + var(--safe-t));box-sizing:border-box;font-feature-settings:"tnum";z-index:5}
#hud.on{display:grid}
#hudL{padding-left:14px;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudL small{font-weight:500;color:var(--ink2);font-size:12px;margin-left:6px}
#hudC{padding:0 12px;font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
#hudC .warn{color:var(--shu)}
#pauseBtn{width:52px;height:48px;border:0;border-left:1px solid var(--rule);background:transparent;display:grid;place-items:center}
#pauseBtn i{display:block;width:12px;height:14px;border-left:4px solid var(--ink);border-right:4px solid var(--ink);box-sizing:border-box}
/* シート: 下から出る帳票。親指で押せる位置にボタンを置く */
#sheetBg{position:absolute;inset:0;background:rgba(34,32,28,.5);display:none;z-index:10}
#sheetBg.on{display:block}
#sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,460px);max-height:calc(100% - 24px - var(--safe-t));overflow:auto;box-sizing:border-box;background:var(--paper);border-top:3px solid var(--ink);padding:22px 20px calc(18px + var(--safe-b));animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#sheet .no{font-size:11.5px;letter-spacing:.14em;color:var(--ink2);margin:0 0 6px}
#sheet h1{font-size:26px;line-height:1.3;margin:0 0 4px;letter-spacing:.02em;padding-right:96px}
#sheet .lead{font-size:15px;line-height:1.75;margin:14px 0 14px;white-space:pre-line}
#sheet dl{margin:0 0 18px;border-top:1px solid var(--ink)}
#sheet dl div{display:grid;grid-template-columns:7.5em 1fr;border-bottom:1px solid var(--rule);padding:9px 0;font-size:14px;line-height:1.6}
#sheet dt{color:var(--ink2)}
#sheet dd{margin:0;font-weight:600;font-feature-settings:"tnum"}
#sheet .acts{display:grid;gap:8px}
.btn{height:54px;border:0;border-radius:2px;background:var(--ink);color:var(--paper);font-size:16px;font-weight:700;letter-spacing:.06em}
.btn:focus-visible,.sub button:focus-visible,#pauseBtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn:active{transform:translateY(1px);opacity:.9}
.sub{display:flex;justify-content:center;gap:4px}
.sub button{min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--ink);font-size:14px;text-decoration:underline;text-underline-offset:3px}
/* 判子: 結果シートの右上に押される。中身は最大4字 */
.stamp{position:absolute;top:12px;right:16px;width:76px;height:76px;border:4px solid var(--shu);border-radius:6px;color:var(--shu);display:grid;place-items:center;font-weight:800;line-height:1.05;text-align:center;transform:rotate(-8deg);opacity:.92;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--shu);animation:stampIn .32s cubic-bezier(.3,1.6,.5,1) .12s both}
.stamp.round{border-radius:50%}
.stamp span{display:block}
@keyframes stampIn{from{transform:rotate(-8deg) scale(1.9);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.92}}
@media (prefers-reduced-motion:reduce){#sheet,.stamp{animation:none}}
/* ===== GAME HACK 共通UI（ここまで）===== */
/* ---- ゲーム固有の見た目: 花見の案内状（和紙・墨・桜色の罫・明朝）と開花情報の帯 ---- */
:root{--scene:#D6E0E2;--paper:#FBF6F0;--paper2:#F4E6E2;--ink:#3A2A28;--ink2:#7A615E;--rule:#E2C6C4;--mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif}
/* HUD: 気象庁の「さくら情報」見出し帯風（紺地に白、下に桜色の細線） */
#hud{background:#22476F;color:#FFFFFF;border-bottom:0;box-shadow:inset 0 -3px 0 #E7A3B5}
#hudL{font-size:15px;letter-spacing:.08em}
#hudL small{color:#D3E2F0;font-size:12.5px}
#hudC{color:#FFFFFF;font-size:15px}
#pauseBtn{border-left-color:rgba(255,255,255,.3)}
#pauseBtn i{border-left-color:#FFFFFF;border-right-color:#FFFFFF}
#pauseBtn:focus-visible{outline-color:#FFFFFF}
#sheet{border-top:0;padding:30px 28px calc(22px + var(--safe-b));box-shadow:inset 0 0 0 9px var(--paper),inset 0 0 0 10px #B88C8A,inset 0 0 0 13px var(--paper),inset 0 0 0 14px #B88C8A}
#sheet .no{font-family:var(--mincho);letter-spacing:.2em;padding-right:92px}
#sheet h1{font-family:var(--mincho);font-weight:700;letter-spacing:.06em}
#sheet > .no:first-child + h1{padding-right:0}
#sheet .lead{font-family:var(--mincho);font-size:15.5px}
#sheet dl{border-top:0}
#sheet dl::before{content:"記";display:block;text-align:center;font-family:var(--mincho);font-size:15px;letter-spacing:.2em;padding:2px 0 8px;border-bottom:1px solid var(--ink)}
#sheet dl div{border-bottom:1px dotted #C9A7A5}
#sheet dt{font-family:var(--mincho)}
#sheet dd{overflow-wrap:anywhere}
.btn{background:#4A302D;font-family:var(--mincho);letter-spacing:.14em}
.sub button{font-family:var(--mincho)}
.stamp{font-family:var(--mincho);border-width:3px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--shu)}
</style>

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <!-- 共通UI: ここから -->
  <div id="hud"><div id="hudL"></div><div id="hudC"></div><button id="pauseBtn" aria-label="一時停止"><i></i></button></div>
  <div id="sheetBg"><div id="sheet" role="dialog" aria-modal="true"></div></div>
  <!-- 共通UI: ここまで -->
</div>
<script>
'use strict';
/* ============================================================
 * GAME HACK 雛形
 * 型: 題材(○○) × 物理化(○○=○○) × 権限(○○できる) × 技術(○○) × 見せ場(○○)
 * ← この1行を自分のゲームに書き換えることから始める
 *
 * 約束:
 *  - 乱数で勝敗を決めない（固定シーケンスか実データ）
 *  - 失敗はプレイヤーの操作・判断に帰因できる
 *  - 操作は1つに絞る。スマホ縦持ち・親指操作・タップ領域44px以上
 *  - 単一ファイル・外部依存なし・ビルド不要
 * ============================================================ */

// ================================================================
// GAME HACK 共通UI（ここから）— 書き換えずにコピーする
// ================================================================
// 論理座標: 横幅 W=420 固定。高さ H は端末の縦横比に合わせて 700〜920 で伸びる（上下の黒帯を出さない）
// 描画は H を見てレイアウトする（上端=HUD 下、下端=親指ゾーン）
const W=420; let H=760;
const HUD_H=48;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let DPR=1,SC=1,TX=0,TY=0,VW=0,VH=0,SAFE_T=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  H=Math.max(700,Math.min(920,Math.round(W*VH/VW)));
  SC=Math.min(VW/W,VH/H); TX=(VW-W*SC)/2; TY=(VH-H*SC)/2;
  SAFE_T=(parseFloat(getComputedStyle($('hud')).paddingTop)||0)/SC;
  if(typeof onResize==='function')onResize();
}
// 画面座標 → 論理座標
function toGame(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left-TX)/SC, y:(e.clientY-r.top-TY)/SC}; }
// DOM 要素の中心 → 論理座標（下部ボタンとの距離判定などに使う）
function elCenter(el){ const r=el.getBoundingClientRect(); return toGame({clientX:r.left+r.width/2,clientY:r.top+r.height/2}); }
// HUD の下端（論理座標）。ゲームの描画はここから下に置く
function topY(){ return HUD_H+SAFE_T; }
// 振動（対応端末のみ）
function buzz(ms){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(_){} }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const UI={
  hud(l,lSmall,c){ $('hud').classList.add('on'); $('hudL').innerHTML=esc(l)+(lSmall?'<small>'+esc(lSmall)+'</small>':''); $('hudC').innerHTML=c||''; },
  hideHud(){ $('hud').classList.remove('on'); },
  /* シートを開く
   * o = { no:'No.01 · 乗務報告', title, lead, rows:[[ラベル,値],...], stamp:'不可'|'発車'(最大4字), round:true(丸印),
   *       main:[ラベル,fn], subs:[[ラベル,fn],...] } */
  sheet(o){
    const s=$('sheet');
    let h='';
    if(o.stamp){ const t=[...o.stamp]; const lines=t.length===4?[t.slice(0,2).join(''),t.slice(2).join('')]:t.length===3?[t.join('')]:[t.join('')];
      const fs=t.length<=2?27:t.length===3?20:22;
      h+='<div class="stamp'+(o.round?' round':'')+'" style="font-size:'+fs+'px">'+lines.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>'; }
    if(o.no)h+='<p class="no">'+esc(o.no)+'</p>';
    h+='<h1>'+esc(o.title)+'</h1>';
    if(o.lead)h+='<p class="lead">'+esc(o.lead)+'</p>';
    if(o.rows&&o.rows.length)h+='<dl>'+o.rows.map(r=>'<div><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>').join('')+'</dl>';
    h+='<div class="acts">';
    if(o.main)h+='<button class="btn" data-k="main">'+esc(o.main[0])+'</button>';
    if(o.subs&&o.subs.length)h+='<div class="sub">'+o.subs.map((b,i)=>'<button data-k="s'+i+'">'+esc(b[0])+'</button>').join('')+'</div>';
    h+='</div>';
    s.innerHTML=h; s.scrollTop=0;
    s.querySelectorAll('button').forEach(b=>{
      const k=b.dataset.k, fn=k==='main'?o.main[1]:o.subs[+k.slice(1)][1];
      b.addEventListener('click',e=>{ e.stopPropagation(); fn(); });
    });
    $('sheetBg').classList.add('on');
    const m=s.querySelector('.btn'); if(m)setTimeout(()=>m.focus({preventScroll:true}),50);
  },
  close(){ $('sheetBg').classList.remove('on'); },
  open(){ return $('sheetBg').classList.contains('on'); },
};
// 共有（𝕏）とポータルへ
function shareX(text,tag){ window.open('https://x.com/intent/post?text='+encodeURIComponent(text+'\n\n#'+tag+' #GAMEHACK\n'+location.href.split('#')[0]),'_blank','noopener'); }
function toPortal(){ location.href='../../'; }
// 一時停止: HUD 右の ‖ / タブ切替で自動停止 / Esc
let pausedFrom=null;
function pause(){
  if(G.screen!=='play')return;
  pausedFrom='play'; G.screen='pause';
  UI.sheet({no:GAME_NO+' · 一時停止中',title:'一時停止',main:['再開する',resume],subs:[['この面をやり直す',()=>{UI.close();restart();}],['一覧へ戻る',toPortal]]});
}
function resume(){ if(G.screen!=='pause')return; UI.close(); G.screen='play'; lastTs=0; }
$('pauseBtn').addEventListener('click',e=>{ e.stopPropagation(); G.screen==='pause'?resume():pause(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden)pause(); });
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ G.screen==='pause'?resume():pause(); } });
// ===== GAME HACK 共通UI（ここまで）=====

 *     × 権限(ブルーシートを日本中どこへでも一瞬で敷き直せる) × 技術(前線の北上速度を読み、場所取り日数ぶん先回りする)

const LON0=129.4, LAT1=45.7, GSTEP=0.05, GW=332, GH=298;   // 129.4〜146.0E / 30.8〜45.7N
const KX=Math.cos(38*Math.PI/180);
const M={s:30,x0:0,y0:0,w:0,h:0};
let PANEL={y:48,h:300}, landPath=null, okiPath=null, OKI_BOX=null;
function px(lon,lat){ return [M.x0+(lon-LON0)*KX*M.s, M.y0+(LAT1-lat)*M.s]; }
function layout(){
  const ww=(GW*GSTEP)*KX, hh=GH*GSTEP;
  // 陸地（129.55〜145.85E）が左右 12px の余白に収まる縮尺。中心は 137.7E
  M.s=Math.min((W-24)/((145.85-129.55)*KX),(H-topY()-8-190)/hh);
  M.w=ww*M.s; M.h=hh*M.s; M.x0=W/2-(137.7-LON0)*KX*M.s; M.y0=H-6-M.h;
  PANEL={y:topY(),h:M.y0-topY()-4};
  landPath=new Path2D();
  for(const r of MAINLAND){ r.forEach((p,i)=>{ const [x,y]=px(p[0],p[1]); i?landPath.lineTo(x,y):landPath.moveTo(x,y); }); landPath.closePath(); }
  // 沖縄本島の挿入図（太平洋側の右下）
  const bw=88, bh=78; OKI_BOX={x:W-12-bw,y:M.y0+M.h-bh-4,w:bw,h:bh};
  okiPath=new Path2D();
  for(const r of OKI){ r.forEach((p,i)=>{ const [x,y]=okiPx(p[0],p[1]); i?okiPath.lineTo(x,y):okiPath.moveTo(x,y); }); okiPath.closePath(); }
  bandCtx=null;
}
function okiPx(lon,lat){ const s=M.s*1.15; return [OKI_BOX.x+18+(lon-127.6)*KX*s, OKI_BOX.y+OKI_BOX.h-10-(lat-26.05)*s]; }
function onResize(){ layout(); }

// 満開日の面（観測地点から逆距離加重で内挿した概略）と等期日線
let GRID=null, ISO=[], bandCv=null, bandCtx=null, bandImg=null;
function inLand(lon,lat){
  let c=false;
  for(const r of MAINLAND){ for(let i=0,j=r.length-1;i<r.length;j=i++){ const a=r[i],b=r[j];
    if((a[1]>lat)!==(b[1]>lat)&&lon<(b[0]-a[0])*(lat-a[1])/(b[1]-a[1])+a[0])c=!c; } }
  return c;
}
function buildGrid(stage){
  const col=YEAR_COL[stage.year];
  const pts=STN.filter(s=>s.sp!=='h'&&s.v[col]!=null).map(s=>[s.lon*KX,s.lat,s.v[col]]);
  GRID=new Float32Array(GW*GH);
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){
    const lon=LON0+(i+.5)*GSTEP, lat=LAT1-(j+.5)*GSTEP, x=lon*KX;
    let sw=0,sv=0,hit=null;
    for(const p of pts){ const d2=(x-p[0])**2+(lat-p[1])**2; if(d2<1e-6){hit=p[2];break;} const w=1/(d2*Math.sqrt(d2)); sw+=w; sv+=w*p[2]; }
    GRID[j*GW+i]=hit!=null?hit:sv/sw;
  }
  // 等期日線: 3/25, 3/31, 4/5 … 5/20（5日ごと）
  const levels=['3/25','3/31','4/5','4/10','4/15','4/20','4/25','4/30','5/5','5/10','5/15','5/20'].map(md2d);
  ISO=levels.map(v=>{
    const segs=[]; let lab=null;
    const P=(i,j)=>[LON0+(i+.5)*GSTEP, LAT1-(j+.5)*GSTEP];
    const lerp=(a,b,va,vb)=>{ const t=(v-va)/(vb-va); return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]; };
    for(let j=0;j<GH-1;j++)for(let i=0;i<GW-1;i++){
      const a=GRID[j*GW+i],b=GRID[j*GW+i+1],c=GRID[(j+1)*GW+i+1],d=GRID[(j+1)*GW+i];
      const pa=P(i,j),pb=P(i+1,j),pc=P(i+1,j+1),pd=P(i,j+1);
      const e=[]; // 辺との交点
      if((a<v)!==(b<v))e.push(lerp(pa,pb,a,b));
      if((b<v)!==(c<v))e.push(lerp(pb,pc,b,c));
      if((c<v)!==(d<v))e.push(lerp(pc,pd,c,d));
      if((d<v)!==(a<v))e.push(lerp(pd,pa,d,a));
      if(e.length>=2)segs.push([e[0],e[1]]);
      if(e.length===4)segs.push([e[2],e[3]]);
    }
    for(const s of segs){ const p=s[0]; if(inLand(p[0],p[1])&&(!lab||p[0]>lab[0]))lab=p; }
    return {v,segs,lab};
  });
}

const OTHERS=[
  [{build:'std',age:'mid',sex:'m',hair:'#2A2420',top:'#5E7A5A',low:'#4A4E5A'},{build:'std',age:'mid',sex:'f',hair:'#4A3428',top:'#C98A5A',low:'#5A5E6A'},{build:'thin',age:'child',sex:'m',hair:'#2A2420',top:'#E1BE48',low:'#3D6A9A'}],
  [{build:'thin',age:'old',sex:'m',hair:'#C8C3BA',top:'#7A6A58',low:'#4A4640'},{build:'big',age:'old',sex:'f',hair:'#A8A29A',top:'#5E7E8E',low:'#4A4640'}],
];
function otherGroup(x,y,h,k){
  const g=OTHERS[k], sc=h/560, w=h*0.32;
  drawSheetScene(x,y,w,h*0.07);
  g.forEach((p,i)=>drawPerson(x+(i-(g.length-1)/2)*w*0.32,y+h*0.012,sc,p,'sit',i%2?-1:1,{}));
}
function drawTree(x,y,s,bp,T,main){
  const SX=1.3;
  ctx.strokeStyle='#4E3B2E'; ctx.lineCap='round';
  for(const [x1,y1,x2,y2,w] of T.segs){ ctx.lineWidth=Math.max(0.8,w*s); ctx.beginPath(); ctx.moveTo(x+x1*s*SX,y+y1*s); ctx.lineTo(x+x2*s*SX,y+y2*s); ctx.stroke(); }
  if(main){ ctx.fillStyle='rgba(0,0,0,.10)'; ctx.beginPath(); ctx.ellipse(x,y+2,s*0.5,s*0.05,0,0,7); ctx.fill(); }
  if(!bp)return;
  const {open,lost,leaf}=bp;
  // 花の塊の下側の影（量感）
  if(open>0.6&&lost<0.8){ ctx.fillStyle='#DE93A9'; for(const b of T.blobs){ if(b.o>open||b.o<lost||b.o<leaf)continue; ctx.beginPath(); ctx.arc(x+b.x*s*SX,y+b.y*s+b.r*s*0.35,b.r*s,0,7); ctx.fill(); } }
  for(const b of T.blobs){
    const bx=x+b.x*s*SX, by=y+b.y*s, br=b.r*s;
    if(b.o>open){ // つぼみ: 赤みの強い膨らみ（満開が近いほど大きい）
      if(!b.tip)continue;
      const k=0.5+open*0.9, rx=Math.max(1.4,s*0.007*k), ry=rx*1.5;
      ctx.fillStyle='#5E7A4A'; ctx.beginPath(); ctx.ellipse(bx,by+ry*0.7,rx*0.8,ry*0.45,0,0,7); ctx.fill();
      ctx.fillStyle=open>0.5?'#D8708C':'#A8445C'; ctx.beginPath(); ctx.ellipse(bx,by,rx,ry,0,0,7); ctx.fill();
      for(const o of [-1,1]){ ctx.beginPath(); ctx.ellipse(bx+o*rx*1.6,by+ry*0.4,rx*0.8,ry*0.8,o*0.5,0,7); ctx.fill(); }
      continue; }
    if(b.o<leaf){ ctx.fillStyle=b.o<leaf*0.5?'#7BA562':'#94B972'; ctx.beginPath(); ctx.arc(bx,by,br*0.9,0,7); ctx.fill(); continue; }
    if(b.o<lost)continue;
    ctx.fillStyle=b.o>0.55?'#F8D3DC':'#F1B6C6'; ctx.beginPath(); ctx.arc(bx,by,br,0,7); ctx.fill();
    if(main&&br>6){ ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(bx-br*0.3,by-br*0.35,br*0.28,0,7); ctx.fill(); }
  }
  if(main&&bp.lost>0){ ctx.fillStyle='rgba(244,190,204,.9)'; const n=Math.round(10+bp.lost*40); SEED=3;
    for(let i=0;i<n;i++){ const px_=x+(srand()-.5)*s*1.1, py=y+srand()*s*0.14; ctx.beginPath(); ctx.ellipse(px_,py,2.4,1.3,srand()*3,0,7); ctx.fill(); } }
}
function updatePetals(s,d,cx,cy,R,y0,h){
  if(s&&d!=null){
    const rate=d<0?0:d<=2?0.3:d<=4?2.2:d<=7?0.6:0;
    if(Math.random()<rate*0.5&&petals.length<160) petals.push({x:cx+(Math.random()-.5)*R*1.0,y:cy+(Math.random()-.3)*R*0.4,vx:-0.3-Math.random()*0.6,vy:0.35+Math.random()*0.4,a:Math.random()*6});
  }
  ctx.fillStyle='#F4B9C8';
  for(let i=petals.length-1;i>=0;i--){ const p=petals[i];
    if(G.screen==='play'){ p.x+=p.vx+Math.sin(p.a)*0.4; p.y+=p.vy; p.a+=0.08; }
    if(p.y>y0+h||p.x<-10){ petals.splice(i,1); continue; }
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.beginPath(); ctx.ellipse(0,0,3,1.6,0,0,7); ctx.fill(); ctx.restore(); }
}
function drawSheetScene(x,y,w,hh){
  const t=hh*0.9;
  ctx.fillStyle=C.sheet; ctx.beginPath(); ctx.moveTo(x-w*0.42,y-t*0.5); ctx.lineTo(x+w*0.42,y-t*0.52); ctx.lineTo(x+w*0.52,y+t*0.5); ctx.lineTo(x-w*0.52,y+t*0.52); ctx.closePath(); ctx.fill();
  ctx.fillStyle=C.sheetD; ctx.beginPath(); ctx.moveTo(x-w*0.52,y+t*0.52); ctx.lineTo(x+w*0.52,y+t*0.5); ctx.lineTo(x+w*0.52,y+t*0.56); ctx.lineTo(x-w*0.52,y+t*0.58); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x-w*0.02,y-t*0.51); ctx.lineTo(x,y+t*0.51); ctx.moveTo(x-w*0.47,y); ctx.lineTo(x+w*0.47,y-t*0.01); ctx.stroke();
  ctx.fillStyle='#E9E4D4'; for(const [gx,gy] of [[-0.4,-0.46],[0.4,-0.48],[0.49,0.45],[-0.49,0.47]]){ ctx.beginPath(); ctx.arc(x+gx*w,y+gy*t,2,0,7); ctx.fill(); }
}
// 人物: 体型(thin/std/big)・年齢(young/mid/old)・髪・服・持ち物をパスで描く。pose: sit/stand/cheer/slump
const STAFF=[
  {who:'新人',build:'thin',age:'young',sex:'m',hair:'#2A2420',top:'#2E3A52',low:'#2E3A52',tie:'#7A2E36'},
  {who:'部長',build:'big',age:'old',sex:'m',hair:'#B9B4AA',top:'#4A4642',low:'#3A3734',tie:'#3D5A80',glasses:1},
  {who:'主任',build:'std',age:'young',sex:'f',hair:'#5A3A26',top:'#D9C6A5',low:'#6C6A7A'},
  {who:'係長',build:'std',age:'mid',sex:'m',hair:'#2E2A26',top:'#F2F0EA',low:'#4C5566',glasses:1,sleeve:1},
  {who:'課長',build:'std',age:'old',sex:'f',hair:'#9A938C',top:'#8C5A6A',low:'#3E3A40'},
];
function drawPeople(x,y,w,sc,onSheet,s,d){
  const A=G.anim;
  if(!onSheet){ // シートを抱えて立つ幹事（新人）
    drawPerson(x-w*0.1,y+18*sc,sc*1.05,STAFF[0],'stand',1,{roll:1});
    return;
  }
  if(!A){ // 場所取り中: 新人ひとり、水筒と座布団
    drawPerson(x-w*0.18,y+6*sc,sc,STAFF[0],'sit',1,{thermos:1});
    return;
  }
  const arrive=Math.min(1,A.t/0.5);
  const seats=[[-0.32,-0.12],[0.0,-0.18],[0.28,-0.1],[-0.16,0.22],[0.16,0.24]];
  const pose=A.t<0.5?'sit':A.ok?'cheer':'slump';
  STAFF.forEach((p,i)=>{
    const [sx,sy]=seats[i]; const dx=i===0?0:(1-arrive)*(-W*0.6-i*30);
    const bob=A.ok&&A.t>0.5?Math.sin((A.t*8)+i)*1.5:0;
    drawPerson(x+sx*w+dx,y+sy*w*0.55+bob,sc*(sy>0?1.05:0.95),p,i===0&&!A.ok?'slump':pose,sx<0?1:-1,{can:A.ok&&i%2===1,cup:A.ok&&i%2===0});
  });
  if(A.t>0.6){
    const lines=A.ok?'かんぱーい！':A.state==='leaf'?'……葉っぱだ':A.state==='fall'?'満開、昨日だって':A.state==='half'?'まだちらほら……':'つぼみ、だね……';
    bubble(x-w*0.05,y-0.18*w*0.55-66*sc-40,lines,A.ok);
  }
}
function bubble(x,y,txt,ok){
  ctx.font='700 14px '+FONT; const tw=ctx.measureText(txt).width+22, th=28;
  const bx=Math.max(6,Math.min(W-6-tw,x-tw/2));
  ctx.fillStyle='#FFFDF6'; ctx.strokeStyle=C.ink; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(bx+4,y); ctx.lineTo(bx+tw-4,y); ctx.quadraticCurveTo(bx+tw,y,bx+tw,y+4); ctx.lineTo(bx+tw,y+th-4); ctx.quadraticCurveTo(bx+tw,y+th,bx+tw-4,y+th);
  ctx.lineTo(x+8,y+th); ctx.lineTo(x-2,y+th+9); ctx.lineTo(x,y+th); ctx.lineTo(bx+4,y+th); ctx.quadraticCurveTo(bx,y+th,bx,y+th-4); ctx.lineTo(bx,y+4); ctx.quadraticCurveTo(bx,y,bx+4,y); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle=C.ink; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,bx+tw/2,y+th/2+1);
}
function shade(hex,k){ const c=rgb(hex); return 'rgb('+c.map(v=>Math.round(v*k)).join(',')+')'; }
function drawPerson(x,y,s,p,pose,face,item){
  item=item||{};
  if(p.age==='child')s*=0.66;
  const bw=p.build==='thin'?0.82:p.build==='big'?1.32:1, old=p.age==='old';
  const slump=pose==='slump', stand=pose==='stand';
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  const skin='#EBC6A2', skinD='#D9AE88';
  const sw=13*bw, hw=(p.build==='big'?15:11)*bw;
  const torsoH=stand?36:34, hipY=stand?-44:0, shY=hipY-torsoH+(slump?5:0)+(old?2:0);
  if(stand){ // 脚と靴
    ctx.strokeStyle=p.low; ctx.lineCap='round'; ctx.lineWidth=7*Math.min(bw,1.1);
    ctx.beginPath(); ctx.moveTo(-4,hipY); ctx.lineTo(-5,-3); ctx.moveTo(4,hipY); ctx.lineTo(6,-3); ctx.stroke();
    ctx.fillStyle='#2B2420'; ctx.beginPath(); ctx.ellipse(-6,-1,6,3,0,0,7); ctx.ellipse(8,-1,6,3,0,0,7); ctx.fill();
  } else { // あぐら／横座り
    ctx.fillStyle=p.low; ctx.beginPath();
    if(p.sex==='f'){ ctx.ellipse(face*6,2,17*bw+3,6,0,0,7); }
    else { ctx.moveTo(-21*bw,3); ctx.quadraticCurveTo(-20*bw,-8,0,-4); ctx.quadraticCurveTo(20*bw,-8,21*bw,3); ctx.quadraticCurveTo(0,10,-21*bw,3); }
    ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(0,6,22*bw,3,0,0,7); ctx.fill();
  }
  // 胴体
  const lean=(slump?4:old?3:0)*face;
  ctx.fillStyle=p.top; ctx.beginPath();
  ctx.moveTo(-hw,hipY);
  ctx.lineTo(-sw+lean,shY+4); ctx.quadraticCurveTo(-sw+lean,shY,-sw+5+lean,shY); ctx.lineTo(sw-5+lean,shY); ctx.quadraticCurveTo(sw+lean,shY,sw+lean,shY+4);
  if(p.build==='big'){ ctx.quadraticCurveTo(sw+7,hipY-12,hw,hipY); } else ctx.lineTo(hw,hipY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.13)'; ctx.beginPath(); ctx.moveTo(lean,shY); ctx.lineTo(sw-5+lean,shY); ctx.quadraticCurveTo(sw+lean,shY,sw+lean,shY+4); ctx.lineTo(hw,hipY); ctx.lineTo(2,hipY); ctx.closePath(); ctx.fill();
  if(p.tie){ ctx.fillStyle='#F2F0EA'; ctx.beginPath(); ctx.moveTo(lean-4,shY); ctx.lineTo(lean+4,shY); ctx.lineTo(lean,shY+9); ctx.closePath(); ctx.fill();
    ctx.fillStyle=p.tie; ctx.beginPath(); ctx.moveTo(lean-1.5,shY+1); ctx.lineTo(lean+1.5,shY+1); ctx.lineTo(lean+2.5,shY+16); ctx.lineTo(lean,shY+19); ctx.lineTo(lean-2.5,shY+16); ctx.closePath(); ctx.fill(); }
  // 腕
  const armC=p.sleeve?skin:p.top;
  ctx.strokeStyle=shade(p.top,0.85); ctx.lineCap='round'; ctx.lineWidth=6*Math.min(bw,1.15);
  const L=[-sw+2+lean,shY+4], R=[sw-2+lean,shY+4];
  const arm=(sx,sy,ex,ey,mx,my)=>{ ctx.strokeStyle=shade(p.top,0.85); ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(mx,my,ex,ey); ctx.stroke(); if(p.sleeve){ ctx.strokeStyle=skin; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo((mx+ex)/2,(my+ey)/2); ctx.lineTo(ex,ey); ctx.stroke(); ctx.lineWidth=6*Math.min(bw,1.15);} ctx.fillStyle=skin; ctx.beginPath(); ctx.arc(ex,ey,3,0,7); ctx.fill(); };
  if(pose==='cheer'){
    arm(L[0],L[1],L[0]-6,hipY-6,L[0]-8,hipY-18);
    arm(R[0],R[1],R[0]+8,shY-20,R[0]+12,shY-4);
    if(item.can){ ctx.fillStyle='#C9CCD0'; ctx.beginPath(); ctx.moveTo(R[0]+5,shY-31); ctx.lineTo(R[0]+11,shY-31); ctx.lineTo(R[0]+11,shY-19); ctx.lineTo(R[0]+5,shY-19); ctx.closePath(); ctx.fill(); ctx.fillStyle='#D8B23A'; ctx.fillRect(R[0]+5,shY-27,6,4); }
    else { ctx.fillStyle='#FFFFFF'; ctx.strokeStyle='#BDB6A6'; ctx.lineWidth=.8; ctx.beginPath(); ctx.moveTo(R[0]+4,shY-31); ctx.lineTo(R[0]+12,shY-31); ctx.lineTo(R[0]+11,shY-20); ctx.lineTo(R[0]+5,shY-20); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  } else if(slump){
    arm(L[0],L[1],-8+lean,hipY-3,L[0]-3,hipY-10); arm(R[0],R[1],8+lean,hipY-3,R[0]+3,hipY-10);
  } else if(stand){
    arm(L[0],L[1],L[0]-2,hipY+4,L[0]-5,hipY-12);
    if(item.roll){ // 丸めたブルーシートを小脇に
      ctx.save(); ctx.translate(R[0]+3,hipY-12); ctx.rotate(-0.35);
      ctx.fillStyle=C.sheet; ctx.beginPath(); ctx.moveTo(-26,-6); ctx.lineTo(18,-6); ctx.quadraticCurveTo(24,0,18,6); ctx.lineTo(-26,6); ctx.quadraticCurveTo(-31,0,-26,-6); ctx.fill();
      ctx.fillStyle=C.sheetD; ctx.beginPath(); ctx.ellipse(18,0,4,6,0,0,7); ctx.fill(); ctx.strokeStyle='#E9E4D4'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-8,-6); ctx.lineTo(-8,6); ctx.moveTo(6,-6); ctx.lineTo(6,6); ctx.stroke();
      ctx.restore();
      arm(R[0],R[1],R[0]+2,hipY-10,R[0]+6,hipY-22);
    } else arm(R[0],R[1],R[0]+2,hipY+4,R[0]+5,hipY-12);
  } else {
    arm(L[0],L[1],-10*bw,hipY-4,L[0]-4,hipY-14); arm(R[0],R[1],10*bw,hipY-4,R[0]+4,hipY-14);
    if(item.thermos){ ctx.fillStyle='#8A9A6E'; ctx.beginPath(); ctx.moveTo(22,-18); ctx.lineTo(29,-18); ctx.lineTo(29,2); ctx.quadraticCurveTo(25.5,4,22,2); ctx.closePath(); ctx.fill(); ctx.fillStyle='#4A4A44'; ctx.fillRect(22,-21,7,4); }
  }
  // 首と頭
  const hr=p.age==='child'?11:p.build==='big'?9.5:8.6, hx=lean*1.4+(slump?face*2:0), hy=shY-hr-(slump?-3:2);
  ctx.fillStyle=skinD; ctx.fillRect(hx-2.5,shY-4,5,5);
  if(p.sex==='f'&&p.age!=='old'){ ctx.fillStyle=p.hair; ctx.beginPath(); ctx.ellipse(hx-face*1.5,hy+5,hr+2,hr+5,0,0,7); ctx.fill(); }
  ctx.fillStyle=skin; ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.fill();
  ctx.fillStyle=skinD; ctx.beginPath(); ctx.arc(hx-face*(hr-1),hy+1,2,0,7); ctx.fill(); // 耳
  // 髪
  ctx.fillStyle=p.hair; ctx.beginPath();
  if(p.sex==='m'&&old){ ctx.arc(hx,hy,hr+0.5,Math.PI*0.95,Math.PI*1.2); ctx.lineTo(hx,hy); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(hx,hy,hr+0.5,Math.PI*1.8,Math.PI*2.05); ctx.lineTo(hx,hy); ctx.closePath(); }
  else if(p.sex==='f'&&old){ for(let i=0;i<6;i++){ const a=Math.PI*(1.05+i*0.18); ctx.moveTo(hx+Math.cos(a)*hr,hy+Math.sin(a)*hr); ctx.arc(hx+Math.cos(a)*hr*0.85,hy+Math.sin(a)*hr*0.85,4,0,7); } }
  else { ctx.arc(hx,hy,hr+0.8,Math.PI*1.02,Math.PI*1.98); ctx.quadraticCurveTo(hx+face*2,hy-hr*0.3,hx-face*hr*0.2,hy-hr*0.45); ctx.closePath(); }
  ctx.fill();
  if(p.sex==='f'&&!old){ ctx.beginPath(); ctx.arc(hx-face*hr*0.6,hy-hr*0.75,4,0,7); ctx.fill(); }
  // 顔
  const fx=hx+face*2.5, eyeY=hy+(slump?1.5:0);
  ctx.fillStyle='#2B2420';
  if(slump){ ctx.fillRect(fx-4,eyeY,3,1.2); ctx.fillRect(fx+1.5,eyeY,3,1.2); }
  else { ctx.beginPath(); ctx.arc(fx-2.8,eyeY,1.1,0,7); ctx.arc(fx+2.8,eyeY,1.1,0,7); ctx.fill(); }
  if(p.glasses){ ctx.strokeStyle='#2B2420'; ctx.lineWidth=0.8; ctx.beginPath(); ctx.arc(fx-2.8,eyeY,2.4,0,7); ctx.moveTo(fx+5.2,eyeY); ctx.arc(fx+2.8,eyeY,2.4,0,7); ctx.stroke(); }
  ctx.strokeStyle='#8E5A48'; ctx.lineWidth=1.1; ctx.beginPath();
  if(pose==='cheer'){ ctx.arc(fx,hy+3.2,2.6,0.15,Math.PI-0.15); } else if(slump){ ctx.arc(fx,hy+6.5,2.2,Math.PI+0.3,-0.3); } else { ctx.moveTo(fx-1.8,hy+4.5); ctx.lineTo(fx+1.8,hy+4.5); }
  ctx.stroke();
  if(old){ ctx.strokeStyle='rgba(120,80,60,.35)'; ctx.lineWidth=.6; ctx.beginPath(); ctx.moveTo(fx-4,hy-3.5); ctx.lineTo(fx+4,hy-3.5); ctx.stroke(); }
  ctx.restore();
}

function draw(){
  ctx.fillStyle='#D6E0E2'; ctx.fillRect(0,0,W,H);
  if(!SD){ SD=stageData(0); buildGrid(SD.st); G.day=md2d('4/2'); }
  drawPanel();
  drawMap();
  if(G.screen==='play'||G.screen==='pause'||G.screen==='result'){
    const st=STAGES[G.stage];
    const day='<span>'+dLabel(G.day)+'</span>';
    UI.hud('さくら情報',st.name+' '+(G.stage+1)+'/'+STAGES.length,day+'　宴会 '+G.done.length+'/'+st.need);
  }
}

// ---- メインループ ----
function frame(ts){
  const dt=lastTs?Math.min((ts-lastTs)/1000,0.05):0; lastTs=ts;
  if(G.screen==='play') update(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=getComputedStyle(document.body).backgroundColor; ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,TX*DPR,TY*DPR);
  draw();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize); resize();
showTitle();
requestAnimationFrame(frame);
</script>
