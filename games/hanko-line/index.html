<html lang="ja">
<head>
<meta charset="utf-8">

<!-- ファビコン: GAME HACK 共通の朱の角印。文字（1字）だけ差し替える -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%226%22 fill=%22none%22 stroke=%22%23C8372D%22 stroke-width=%226%22/><text x=%2232%22 y=%2244%22 font-size=%2234%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%23C8372D%22>決</text></svg>">
<style>
/* ================================================================
 * GAME HACK 共通UI（ここから）— 全ゲームで同じものをコピーして使う
 * 世界観: 業務帳票。紙 × 墨 × 朱（ハンコの赤）。
 * - 朱は「判子」と「失敗」にだけ使う。ボタンや装飾には使わない
 * - 角丸は 2px まで。影・グラデーション・絵文字は使わない
 * ================================================================ */
:root{
  --paper:#F3EFE4; --paper2:#E8E1CF; --ink:#22201C; --ink2:#5E584D; --rule:#CDC3AC; --shu:#C8372D;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDGothic","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--scene,#2b2a27);font-family:var(--font);color:var(--ink);-webkit-text-size-adjust:100%}
#wrap{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
/* HUD: 帳票の見出し帯。左=どこ / 中=いまの数値 / 右=一時停止 */
#hud{position:absolute;left:0;right:0;top:0;padding-top:var(--safe-t);background:var(--paper);border-bottom:1px solid var(--ink);display:none;grid-template-columns:1fr auto 52px;align-items:center;height:calc(48px + var(--safe-t));box-sizing:border-box;font-feature-settings:"tnum";z-index:5}
#hud.on{display:grid}
#hudL{padding-left:14px;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudL small{font-weight:500;color:var(--ink2);font-size:12px;margin-left:6px}
#hudC{padding:0 12px;font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
#hudC .warn{color:var(--shu)}
#pauseBtn{width:52px;height:48px;border:0;border-left:1px solid var(--rule);background:transparent;display:grid;place-items:center}
#pauseBtn i{display:block;width:12px;height:14px;border-left:4px solid var(--ink);border-right:4px solid var(--ink);box-sizing:border-box}
/* シート: 下から出る帳票。親指で押せる位置にボタンを置く */
#sheetBg{position:absolute;inset:0;background:rgba(34,32,28,.5);display:none;z-index:10}
#sheetBg.on{display:block}
#sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,460px);max-height:calc(100% - 24px - var(--safe-t));overflow:auto;box-sizing:border-box;background:var(--paper);border-top:3px solid var(--ink);padding:22px 20px calc(18px + var(--safe-b));animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#sheet .no{font-size:11.5px;letter-spacing:.14em;color:var(--ink2);margin:0 0 6px}
#sheet h1{font-size:26px;line-height:1.3;margin:0 0 4px;letter-spacing:.02em;padding-right:96px;word-break:auto-phrase;text-wrap:balance}
#sheet .lead{font-size:15px;line-height:1.75;margin:14px 0 14px;white-space:pre-line}
#sheet dl{margin:0 0 18px;border-top:1px solid var(--ink)}
#sheet dl div{display:grid;grid-template-columns:7.5em 1fr;border-bottom:1px solid var(--rule);padding:9px 0;font-size:14px;line-height:1.6}
#sheet dt{color:var(--ink2)}
#sheet dd{margin:0;font-weight:600;font-feature-settings:"tnum"}
#sheet .acts{display:grid;gap:8px}
.btn{height:54px;border:0;border-radius:2px;background:var(--ink);color:var(--paper);font-size:16px;font-weight:700;letter-spacing:.06em}
.btn:focus-visible,.sub button:focus-visible,#pauseBtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn:active{transform:translateY(1px);opacity:.9}
.sub{display:flex;flex-wrap:wrap;justify-content:center;gap:0 4px}
.sub button{min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--ink);font-size:14px;text-decoration:underline;text-underline-offset:3px}
/* 判子: 結果シートの右上に押される。中身は最大4字 */
.stamp{position:absolute;top:12px;right:16px;width:76px;height:76px;border:4px solid var(--shu);border-radius:6px;color:var(--shu);display:grid;place-items:center;font-weight:800;line-height:1.05;text-align:center;transform:rotate(-8deg);opacity:.92;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--shu);animation:stampIn .32s cubic-bezier(.3,1.6,.5,1) .12s both}
.stamp.round{border-radius:50%}
.stamp span{display:block}
@keyframes stampIn{from{transform:rotate(-8deg) scale(1.9);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.92}}
@media (prefers-reduced-motion:reduce){#sheet,.stamp{animation:none}}
/* ===== GAME HACK 共通UI（ここまで）===== */
</style>
<style>
/* ===== ゲーム固有の見た目: 学校事務室の起案用紙・監査報告書 ===== */
:root{--scene:#8F6139;--paper:#FCFBF6;--paper2:#EEEBE0;--ink:#1F1E1B;--ink2:#56524A;--rule:#B9B3A3;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","BIZ UDMincho",serif}
#hud{border-bottom:3px double var(--ink)}
#hudL{font-family:var(--mincho);letter-spacing:.06em;margin:7px 0 7px 10px;padding:0 10px;line-height:32px;border:1px solid var(--ink);background:var(--paper2)}
#hudL small{font-family:var(--font)}
#hudC{align-self:stretch;display:flex;align-items:center;border-left:1px solid var(--rule)}
#sheet{border-top:5px double var(--ink);padding-top:20px}
#sheet .no{font-family:var(--mincho);letter-spacing:.04em;font-size:12px;line-height:1.5;padding-right:92px}
#sheet h1{font-family:var(--mincho);font-weight:700;letter-spacing:.18em;font-size:25px}
#sheet .lead{line-height:1.7;font-family:var(--mincho)}
#sheet dl{border:1px solid var(--ink)}
#sheet dl div{grid-template-columns:7.8em 1fr;padding:0;border-bottom:1px solid var(--ink)}
#sheet dl div:last-child{border-bottom:0}
#sheet dt{background:var(--paper2);border-right:1px solid var(--ink);padding:8px 10px;font-family:var(--mincho);color:var(--ink)}
#sheet dd{padding:8px 10px}
.btn{border-radius:0;letter-spacing:.24em}
.stamp{font-family:var(--mincho);border-width:3px;opacity:.86}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <!-- 共通UI: ここから -->
  <div id="hud"><div id="hudL"></div><div id="hudC"></div><button id="pauseBtn" aria-label="一時停止"><i></i></button></div>
  <div id="sheetBg"><div id="sheet" role="dialog" aria-modal="true"></div></div>
  <!-- 共通UI: ここまで -->
</div>
<script>
'use strict';
/* ============================================================
 * GAME HACK 雛形
 * 型: 題材(○○) × 物理化(○○=○○) × 権限(○○できる) × 技術(○○) × 見せ場(○○)
 * ← この1行を自分のゲームに書き換えることから始める
 *
 * 約束:
 *  - 乱数で勝敗を決めない（固定シーケンスか実データ）
 *  - 失敗はプレイヤーの操作・判断に帰因できる
 *  - 操作は1つに絞る。スマホ縦持ち・親指操作・タップ領域44px以上
 *  - 単一ファイル・外部依存なし・ビルド不要
 * ============================================================ */

// ================================================================
// GAME HACK 共通UI（ここから）— 書き換えずにコピーする
// ================================================================
// 論理座標: 横幅 W=420 固定。高さ H は端末の縦横比に合わせて 700〜920 で伸びる（上下の黒帯を出さない）
// 描画は H を見てレイアウトする（上端=HUD 下、下端=親指ゾーン）
const W=420; let H=760;
const HUD_H=48;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let DPR=1,SC=1,TX=0,TY=0,VW=0,VH=0,SAFE_T=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  H=Math.max(700,Math.min(920,Math.round(W*VH/VW)));
  SC=Math.min(VW/W,VH/H); TX=(VW-W*SC)/2; TY=(VH-H*SC)/2;
  SAFE_T=(parseFloat(getComputedStyle($('hud')).paddingTop)||0)/SC;
  if(typeof onResize==='function')onResize();
}
// 画面座標 → 論理座標
function toGame(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left-TX)/SC, y:(e.clientY-r.top-TY)/SC}; }
// DOM 要素の中心 → 論理座標（下部ボタンとの距離判定などに使う）
function elCenter(el){ const r=el.getBoundingClientRect(); return toGame({clientX:r.left+r.width/2,clientY:r.top+r.height/2}); }
// HUD の下端（論理座標）。ゲームの描画はここから下に置く
function topY(){ return HUD_H+SAFE_T; }
// 振動（対応端末のみ）
function buzz(ms){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(_){} }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const UI={
  hud(l,lSmall,c){ $('hud').classList.add('on'); $('hudL').innerHTML=esc(l)+(lSmall?'<small>'+esc(lSmall)+'</small>':''); $('hudC').innerHTML=c||''; },
  hideHud(){ $('hud').classList.remove('on'); },
  /* シートを開く
   * o = { no:'No.01 · 乗務報告', title, lead, rows:[[ラベル,値],...], stamp:'不可'|'発車'(最大4字), round:true(丸印),
   *       main:[ラベル,fn], subs:[[ラベル,fn],...] } */
  sheet(o){
    const s=$('sheet');
    let h='';
    if(o.stamp){ const t=[...o.stamp]; const lines=t.length===4?[t.slice(0,2).join(''),t.slice(2).join('')]:t.length===3?[t.join('')]:[t.join('')];
      const fs=t.length<=2?27:t.length===3?20:22;
      h+='<div class="stamp'+(o.round?' round':'')+'" style="font-size:'+fs+'px">'+lines.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>'; }
    if(o.no)h+='<p class="no">'+esc(o.no)+'</p>';
    h+='<h1>'+esc(o.title)+'</h1>';
    if(o.lead)h+='<p class="lead">'+esc(o.lead)+'</p>';
    if(o.rows&&o.rows.length)h+='<dl>'+o.rows.map(r=>'<div><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>').join('')+'</dl>';
    h+='<div class="acts">';
    if(o.main)h+='<button class="btn" data-k="main">'+esc(o.main[0])+'</button>';
    // 𝕏 の共有ボタンがあれば、その隣に Facebook の共有を足す
    if(o.subs){ const i=o.subs.findIndex(b=>/𝕏/.test(b[0])); if(i>=0&&!o.subs.some(b=>/Facebook/.test(b[0]))) o.subs=[...o.subs.slice(0,i+1),['Facebookで共有',shareFB],...o.subs.slice(i+1)]; }
    if(o.subs&&o.subs.length)h+='<div class="sub">'+o.subs.map((b,i)=>'<button data-k="s'+i+'">'+esc(b[0])+'</button>').join('')+'</div>';
    h+='</div>';
    s.innerHTML=h; s.scrollTop=0;
    s.querySelectorAll('button').forEach(b=>{
      const k=b.dataset.k, fn=k==='main'?o.main[1]:o.subs[+k.slice(1)][1];
      b.addEventListener('click',e=>{ e.stopPropagation(); fn(); });
    });
    $('sheetBg').classList.add('on');
    const m=s.querySelector('.btn'); if(m)setTimeout(()=>m.focus({preventScroll:true}),50);
  },
  close(){ $('sheetBg').classList.remove('on'); },
  open(){ return $('sheetBg').classList.contains('on'); },
};
// 共有（𝕏）とポータルへ
function shareX(text,tag){ window.open('https://x.com/intent/post?text='+encodeURIComponent(text+'\n\n#'+tag+' #GAMEHACK\n'+location.href.split('#')[0]),'_blank','noopener'); }
function shareFB(){ window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href.split('#')[0]),'_blank','noopener'); }
function toPortal(){ location.href='../../'; }
// 一時停止: HUD 右の ‖ / タブ切替で自動停止 / Esc
let pausedFrom=null;
function pause(){
  if(G.screen!=='play')return;
  pausedFrom='play'; G.screen='pause';
  UI.sheet({no:GAME_NO+' · 一時停止中',title:'一時停止',main:['再開する',resume],subs:[['この面をやり直す',()=>{UI.close();restart();}],['一覧へ戻る',toPortal]]});
}
function resume(){ if(G.screen!=='pause')return; UI.close(); G.screen='play'; lastTs=0; }
$('pauseBtn').addEventListener('click',e=>{ e.stopPropagation(); G.screen==='pause'?resume():pause(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden)pause(); });
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ G.screen==='pause'?resume():pause(); } });
// ===== GAME HACK 共通UI（ここまで）=====


// ---- ゲーム固有 ----------------------------------------------
/* ハンコ決裁ライン
 * 型: 題材(学校事務室の決裁) × 物理化(決裁=ベルトで流れてくる伺い書) × 権限(臨時採用2日目で校長印を預かる) × 技術(書式を読む＋そっと押す) × 見せ場(監査で付箋まみれ)
 * 乱数なし: 曜日ごとの書類の並びは固定。不備は書類データから audit() が計算する（表示と指摘が必ず一致する）。 */
const GAME_NO='No.02';
const TAG='ハンコ決裁ライン';
const FF=getComputedStyle(document.body).fontFamily;
const MIN='"Hiragino Mincho ProN","Yu Mincho","BIZ UDMincho",serif';
const INK='#22201C', SHU='#C8372D';

/*DATA-BEGIN*/
const SCHOOL='みなと市立青葉中学校長';
const DEPTS=['第1学年','第2学年','第3学年','事務室','保健室'];
const CHIEF={'第1学年':'加藤','第2学年':'中村','第3学年':'吉田','事務室':'木村','保健室':'加藤','第4学年':'吉田'};
// 予算科目（地方自治法施行規則 別記「歳出予算に係る節の区分」の節名。需用費は細節つき）
const BUDGET={consumable:'需用費（消耗品費）',repair:'需用費（修繕料）',equipment:'備品購入費',travel:'旅費',rental:'使用料及び賃借料',fee:'報償費'};
const CATNAME={consumable:'消耗品',repair:'修繕',equipment:'備品',travel:'出張の旅費',rental:'借上げ',fee:'謝礼'};
const MDAYS=[0,31,28,31,30,31,30,31,31,30,31,30,31]; // 令和8年(2026)は平年
const okDate=a=>a[0]>=1&&a[0]<=12&&a[1]>=1&&a[1]<=MDAYS[a[0]];
const dnum=a=>a[0]*100+a[1];
const fmtD=a=>a[0]+'月'+a[1]+'日';
const yen=n=>n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
// 書類の種類ごとの様式
const FORMOF={consumable:'物品購入伺',equipment:'物品購入伺',repair:'修繕伺',rental:'支出伺',fee:'支出伺',travel:'出張命令伺'};
const YOSHIKI={'物品購入伺':'様式第3号（第8条関係）','支出伺':'様式第1号（第5条関係）','修繕伺':'様式第4号（第9条関係）','出張命令伺':'様式第7号（第14条関係）'};
const WHEN={consumable:'納品予定日',equipment:'納品予定日',repair:'施工予定日',rental:'実施日',fee:'実施日',travel:'期間'};
// rows は [品名,数量,単位,単価]。金額・合計・伺額は計算して入れる（不備の書類は want と書き換えを持つ）
let NO=400;
function mk(o){
  const form=o.form||FORMOF[o.cat];
  const r={yoshiki:YOSHIKI[form],to:SCHOOL,...o,form,no:'R8-0'+(++NO)};
  r.rows=o.rows.map(x=>x.length>4?x:[x[0],x[1],x[2],x[3],x[1]*x[3]]);
  r.total=o.total!=null?o.total:r.rows.reduce((a,x)=>a+x[4],0);
  r.amount=o.amount!=null?o.amount:r.total;
  if(Array.isArray(o.when)) r.when={l:WHEN[o.cat],a:o.when[0],b:o.when[1]};
  r.seals={kocho:null,kyoto:'渡辺',jimu:'小林',shunin:CHIEF[o.dept],kian:o.who.split(' ')[0],...(o.seals||{})};
  return r;
}
// 全49枚。曜日をまたいで同じ書類は出ない（題材・起案者・品目・金額の組み合わせはすべて別）
const ALL={
  // ---- 月 ----
  yoshi:mk({dept:'事務室',who:'森 健太',subj:'印刷用紙の購入について',cat:'consumable',kian:[10,1],when:[[10,8]],
    rows:[['PPC用紙 A4',10,'箱',3280]]}),
  tai:mk({dept:'第1学年',who:'佐野 健',subj:'体育用品の購入について',cat:'consumable',kian:[10,2],when:[[10,16]],
    rows:[['ソフトバレーボール',6,'個',2500],['ラインテープ',4,'巻',1650]]}),
  wagyu:mk({want:'shibutsu',dept:'事務室',who:'高橋 恵',subj:'来客用茶菓の購入について',cat:'consumable',kian:[10,2],when:[[10,9]],
    rows:[['緑茶ティーバッグ',4,'箱',580],['黒毛和牛 5kg',1,'箱',54000]]}),
  hoken:mk({dept:'保健室',who:'松本 由紀',subj:'保健室衛生材料の購入について',cat:'consumable',kian:[10,2],when:[[10,13]],
    rows:[['絆創膏',10,'箱',680],['冷却シート',12,'箱',390],['消毒用アルコール',6,'本',1180]]}),
  noseal1:mk({want:'noseal',dept:'第3学年',who:'井上 美咲',subj:'校外学習のバス借上げについて',cat:'rental',kian:[10,1],when:[[10,23]],
    rows:[['大型バス借上げ',2,'台',132000]],seals:{kian:null}}),
  cam:mk({dept:'第1学年',who:'小川 真理',subj:'書画カメラの購入について',cat:'equipment',kian:[10,2],when:[[10,20]],
    rows:[['書画カメラ',1,'台',68000]]}),
  done1:mk({want:'done',dept:'第2学年',who:'山田 花子',subj:'理科教育研究大会への出張について',cat:'travel',kian:[10,2],when:[[10,22],[10,23]],
    rows:[['交通費（往復）',1,'式',23000],['宿泊料',1,'泊',10900],['日当',2,'日',2200]],seals:{kocho:'大森'}}),
  // ---- 火 ----

// 書類の不備をデータから計算する（指摘文はそのまま事務長・監査の言葉になる）
function audit(d){
  const f=[]; const add=(t,msg)=>f.push({t,msg});
  if(d.to!==SCHOOL) add('addr','宛先が「'+d.to+'」です。うちは'+SCHOOL.replace(/長$/,'')+'です');
  if(!DEPTS.includes(d.dept)) add('grade','中学校に「'+d.dept+'」はありません');
  if(d.form!==FORMOF[d.cat]) add('form',CATNAME[d.cat]+'は「'+FORMOF[d.cat]+'」で出してください。「'+d.form+'」の様式になっています');
  if(!okDate(d.kian)) add('baddate','起案日の'+fmtD(d.kian)+'は存在しない日付です');
  for(const k of ['a','b']) if(d.when[k]&&!okDate(d.when[k])) add('baddate',d.when.l+'の'+fmtD(d.when[k])+'は存在しない日付です');
  if(okDate(d.kian)&&okDate(d.when.a)&&dnum(d.when.a)<dnum(d.kian)) add('order',d.when.l+' '+fmtD(d.when.a)+'が起案日 '+fmtD(d.kian)+'より前です（事後の伺い）');
  if(d.when.b&&okDate(d.when.a)&&okDate(d.when.b)&&dnum(d.when.b)<dnum(d.when.a)) add('order','帰着の'+fmtD(d.when.b)+'が出発の'+fmtD(d.when.a)+'より前です');
  const sur=d.who.split(' ')[0];
  if(!d.seals.kian) add('noseal','起案者 '+d.who+' の印がありません');
  else if(d.seals.kian!==sur) add('sealname','起案者は'+d.who+'なのに、起案欄の印は「'+d.seals.kian+'」です');
  for(const [k,n] of [['shunin','主任'],['jimu','事務長'],['kyoto','教頭']]) if(!d.seals[k]) add('skip',n+'の印が抜けたまま校長に回っています');
  if(d.seals.kocho) add('done','校長欄にもう印があります（二重決裁）');
  if(d.fix&&d.fix.seal!==sur) add('teisei',d.when.l+'を二重線で直してありますが、'+(d.fix.seal?'訂正印が「'+d.fix.seal+'」です':'訂正印がありません'));
  let s=0;
  for(const r of d.rows){ s+=r[4];
    if(PRIV[r[0]]) add('shibutsu',PRIV[r[0]]);
    else if(OFF[r[0]]&&OFF[r[0]]!==d.subj) add('subj','件名は「'+d.subj+'」なのに、明細に「'+r[0]+'」があります');
    if(r[2]&&r[3]*r[1]!==r[4]) add('mult',r[0]+' '+yen(r[3])+'円×'+r[1]+'は ¥'+yen(r[3]*r[1])+'。¥'+yen(r[4])+'と書かれています'); }
  if(s!==d.total) add('sum','合計 ¥'+yen(d.total)+'が明細の和 ¥'+yen(s)+'と合いません');
  if(d.amount!==d.total) add('digit','伺額が金'+yen(d.amount)+'円。明細の合計は ¥'+yen(d.total)+'です。桁が違います');
  const bud=d.budget||BUDGET[d.cat];
  if(bud!==BUDGET[d.cat]) add('budget',d.rows[0][0]+'は'+CATNAME[d.cat]+'なので'+BUDGET[d.cat]+'。「'+bud+'」になっています');
  if(needAtt(d)){ const t=ATT(d);
    if(!t.chk) add('mitsu','5万円を超えるのに、添付の見積書にチェックがありません');
    else if(t.n<2) add('aimitsu','見積書が1社分だけです。5万円を超える物は2社から取ってください'); }
  return f;
}

  if(o.ret>0) return {x:bx+(o.hx-bx)*o.ret,y:by+(o.hy-by)*o.ret};
  return {x:bx,y:by};
}
function boxRect(o,k){ const p=docPos(o),s=DS(); return {x:p.x+(BOX.x0+BOX.w*k)*s,y:p.y+BOX.y0*s,w:BOX.w*s,h:BOX.h*s}; }
function inR(p,r,m){ m=m||0; return p.x>=r.x-m&&p.x<=r.x+r.w+m&&p.y>=r.y-m&&p.y<=r.y+r.h+m; }

// ---- 判定 ----
function say(text,kind,t){ G.note={text,t:t||3.6,kind}; }
function miss(o,msg){
  G.miss++; G.misses.push(msg); G.shake=0.35; buzz(60);
  if(o){ o.tag='指摘'; }
  say('監査メモ: '+msg,'bad',4.2);
  if(G.miss>=3) startAudit();
}
function approve(o,speed){
  if(speed>TH){ o.mark={k:'smear',box:0,rot:0.5}; o.st='flag'; return miss(o,'勢いよく押して校長印がにじみました（'+o.d.subj+'）'); }
  o.mark={k:'ok',box:0,rot:-0.06+((o.i*37)%10)/80};
  if(o.f.length){ o.st='flag'; return miss(o,o.f[0].msg+'。それでも押印しました'); }
  o.st='ok'; G.ok++; buzz(15);
}
function reject(o){
  o.st='rej'; o.inTray=true;
  if(!o.f.length) return miss(o,o.d.who+'さんの'+o.d.form+'「'+o.d.subj+'」に不備はありません（誤って差戻し）');
  G.rej++;
  const t=o.f[0].t; G.caught[t]=(G.caught[t]||0)+1;
  say('差戻: '+o.f[0].msg,'ok',3.4);
}
function pendingDocs(){ return G.docs.filter(o=>o.st==='belt'||o.st==='held'); }
// キーボード用: いちばん手前で押印できる書類
function frontDoc(){
  let best=null;
  for(const o of G.docs){ if(o.st!=='belt')continue; const r=boxRect(o,0); if(r.y<topY()||r.y+r.h>BE())continue; if(!best||o.i<best.i)best=o; }
  return best;
}

function update(dt){
  const D=DAYS[G.day];
  G.t+=dt;
  G.k+=((stampOverDoc()?0.4:1)-G.k)*Math.min(1,dt*8);    // ハンコが書類の上にある間だけベルト減速
  G.s+=beltV(D)*G.k*dt;
  for(const o of G.docs){
    if(o.ret>0) o.ret=Math.max(0,o.ret-dt*5);
    if(o.st==='belt'){
      const r=boxRect(o,0);
      if(r.y+r.h/2>BE()){ o.st='flag'; miss(o,o.f.length?o.f[0].msg+'。見逃して流れました':o.d.who+'さんの「'+o.d.subj+'」が未決裁のまま流れました'); if(G.screen!=='play')return; }
    }
    if(o.st==='rej'){
      if(!o.fly){ const p=docPos(o); o.fly={x:p.x,y:p.y,vx:0,vy:0,r:0}; }
      const f=o.fly, tx=330, ty=BE()+70;
      f.x+=(tx-DW*DS()*0.2-f.x)*Math.min(1,dt*7); f.y+=(ty-f.y)*Math.min(1,dt*7); f.r+=(0.35-f.r)*Math.min(1,dt*7);
      if(Math.abs(ty-f.y)<4||f.t>1.2) o.st='gone'; f.t=(f.t||0)+dt;
    }
    if((o.st==='ok'||o.st==='flag')&&docTop(o)>H) o.st='gone';
  }
  if(G.note&&(G.note.t-=dt)<=0) G.note=null;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt);
  if(G.docs.every(o=>o.st==='gone'||((o.st==='ok'||o.st==='flag')&&docTop(o)>BE()))) dayClear();
}

// ---- 入力（ドラッグだけ）----
function track(st,p){ const t=performance.now(); st.samples.push({x:p.x,y:p.y,t}); while(st.samples.length>2&&t-st.samples[1].t>200) st.samples.shift(); }
// 直近80msの移動から速度を出す（1フレームの揺れで判定しない）
function speedOf(st){
  const s=st.samples, now=performance.now(); if(s.length<2) return {v:0,vx:0,vy:0};
  const last=s[s.length-1]; if(now-last.t>80) return {v:0,vx:0,vy:0};
  let a=s[0]; for(const q of s){ if(last.t-q.t>=80) a=q; }
  const dt=Math.max(16,last.t-a.t)/1000, vx=(last.x-a.x)/dt, vy=(last.y-a.y)/dt;
  return {v:Math.hypot(vx,vy),vx,vy};
}
let PID=null;
$('wrap').addEventListener('pointerdown',e=>{
  if(G.screen!=='play'||PID!==null)return;
  const p=toGame(e), st=G.stamp;
  if(Math.hypot(p.x-st.x,p.y-(st.y-30))<64){
    PID=e.pointerId; st.held=true; st.ox=st.x-p.x; st.oy=st.y-p.y; st.samples=[]; st.down=performance.now(); track(st,p);
  }else if(p.y<BE()){
    const hit=G.docs.filter(o=>o.st==='belt').find(o=>{ const q=docPos(o); return p.x>=q.x&&p.x<=q.x+DW*DS()&&p.y>=q.y&&p.y<=q.y+DH*DS(); });
    if(!hit)return;
    const q=docPos(hit);
    PID=e.pointerId; hit.st='held'; hit.hx=q.x; hit.hy=q.y;
    G.grab={o:hit,gx:p.x-q.x,gy:p.y-q.y,sx:p.x,samples:[]}; track(G.grab,p);
  }else return;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
});
$('wrap').addEventListener('pointermove',e=>{
  if(e.pointerId!==PID)return;
  const p=toGame(e), st=G.stamp;
  if(st.held){
    track(st,p);
    st.ox*=0.7; st.oy+=(-62-st.oy)*0.3;   // 指で印面が隠れないよう、持ち上げると指の少し上に来る
    st.x=Math.max(20,Math.min(W-20,p.x+st.ox)); st.y=Math.max(topY()+10,Math.min(H-20,p.y+st.oy));
  }else if(G.grab){
    track(G.grab,p);
    const o=G.grab.o; o.hx=p.x-G.grab.gx; o.hy=p.y-G.grab.gy;
  }
});
function endPointer(e){
  if(e.pointerId!==PID)return;
  PID=null;
  const st=G.stamp;
  if(st.held){
    const sp=speedOf(st).v; st.held=false;
    if(G.screen==='play') dropStamp({x:st.x,y:st.y},sp);
    const r=restPos(); st.x=r.x; st.y=r.y; st.samples=[];
  }else if(G.grab){
    const g=G.grab, o=g.o, v=speedOf(g); G.grab=null;
    if(o.st!=='held')return;
    const p=g.samples[g.samples.length-1];
    if(p.x-g.sx>90||v.vx>450){ o.fly={x:o.hx,y:o.hy,vx:0,vy:0,r:0}; reject(o); }
    else { o.st='belt'; o.ret=1; }
  }
}
$('wrap').addEventListener('pointerup',endPointer);
$('wrap').addEventListener('pointercancel',endPointer);
function dropStamp(p,sp){
  for(const o of G.docs){
    if(o.st!=='belt')continue;
    for(let k=0;k<5;k++){
      const r=boxRect(o,k);
      if(r.y+r.h/2>BE())continue;
      if(inR(p,r,k===0?8:0)){
        if(k===0) return approve(o,sp);
        o.mark={k:'wrong',box:k,rot:0.2}; o.st='flag';
        return miss(o,BOXN[k]+'の欄に校長印を押しました（'+o.d.subj+'）');
      }
    }
  }
}
window.addEventListener('keydown',e=>{
  if(G.screen!=='play')return;
  const o=frontDoc(); if(!o)return;
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); approve(o,0); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); reject(o); }
});

function seal(x,y,r,name,alpha,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.globalAlpha=alpha==null?0.88:alpha;
  ctx.strokeStyle=SHU; ctx.fillStyle=SHU; ctx.lineWidth=r*0.13;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  const ch=[...name]; ctx.font='700 '+(r*0.74)+'px '+MIN; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(ch.length===1) ctx.fillText(ch[0],0,0); else { ctx.fillText(ch[0],0,-r*0.38); ctx.fillText(ch[1],0,r*0.4); }
  if(LAYOUT_LOG) LAYOUT_LOG.push({seal:name,chars:ch.length,cw:Math.max(...ch.map(c=>ctx.measureText(c).width)),r});
  ctx.restore(); ctx.textBaseline='alphabetic';
}
function txt(s,x,y,size,opt){

// 欄 [x0,x1] に収めて描く。入らなければ 10px まで縮小、それでも入らなければ横に詰める
let LAYOUT_LOG=null;
function ftxt(s,x0,x1,y,size,opt){
  opt=opt||{}; const f=(opt.w||500)+' ', fam='px '+(opt.f||FF), maxW=x1-x0; const size0=size;
  ctx.font=f+size+fam; let w=ctx.measureText(s).width;
  if(w>maxW){ size=Math.max(10,Math.floor(size*maxW/w*10)/10); ctx.font=f+size+fam; w=ctx.measureText(s).width; }
  const sx=w>maxW?maxW/w:1, a=opt.a||'left', ax=a==='left'?x0:a==='right'?x1:(x0+x1)/2;
  ctx.fillStyle=opt.c||INK; ctx.textAlign=a;
  ctx.save(); ctx.translate(ax,y); ctx.scale(sx,1); ctx.fillText(s,0,0); ctx.restore();
  if(LAYOUT_LOG){ const L=a==='left'?ax:a==='right'?ax-w*sx:ax-w*sx/2; LAYOUT_LOG.push({s,x0,x1,l:L,r:L+w*sx,y,size,size0,sx}); }
}

  for(let j=1;j<4;j++){ ctx.moveTo(cx[j],T); ctx.lineTo(cx[j],T+90); } ctx.moveTo(cx[3],T+90); ctx.lineTo(cx[3],T+114); ctx.stroke();
  ctx.fillStyle='rgba(34,32,28,.06)'; ctx.fillRect(16.5,T+0.5,327,17.5);
  ['品名','数量','単価','金額'].forEach((h,j)=>ftxt(h,cx[j]+4,cx[j+1]-4,T+13.5,12,{a:'center',c:'#5E584D'}));
  d.rows.forEach((r,j)=>{ const yy=T+18+24*j+17;
    ftxt(r[0],cx[0]+6,cx[1]-4,yy,13.5); ftxt(r[1]+r[2],cx[1]+4,cx[2]-4,yy,13.5,{a:'right'});
    ftxt(yen(r[3]),cx[2]+4,cx[3]-4,yy,13.5,{a:'right'}); ftxt(yen(r[4]),cx[3]+4,cx[4]-4,yy,13.5,{a:'right'}); });
  ftxt('合　計',cx[0]+6,cx[3]-12,T+108,13.5,{a:'right',w:700}); ftxt('¥'+yen(d.total),cx[3]+4,cx[4]-4,T+108,14,{a:'right',w:700});
  const att=needAtt(d);
  labeled('予算科目',d.budget||BUDGET[d.cat],390,13.5,600,att?206:344);
  if(att){ const t=ATT(d);
    ftxt('添付',214,240,390,12.5,{c:'#5E584D'});
    ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.strokeRect(244.5,379.5,11,11);
    if(t.chk){ ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(246.5,384.5); ctx.lineTo(249.5,388); ctx.lineTo(254.5,380.5); ctx.stroke(); }
    ftxt(t.chk?'見積書 '+t.n+'社':'見積書',260,344,390,13.5,{w:600}); }
  if(d.fix) fixedDate(d,412); else labeled(d.when.l,'令和8年'+fmtD(d.when.a)+(d.when.b?' 〜 '+fmtD(d.when.b):''),412,13.5,600);
  // 付箋（監査メモ）
  if(o.tag){ ctx.save(); ctx.translate(300,96); ctx.rotate(0.12); ctx.fillStyle='#F3A9B6'; ctx.fillRect(0,0,58,72);
    ctx.fillStyle='rgba(0,0,0,.08)'; ctx.fillRect(0,0,58,10); txt('監査',29,34,14,{a:'center',w:700,c:'#7A2430'}); txt('メモ',29,54,14,{a:'center',w:700,c:'#7A2430'}); ctx.restore(); }
  ctx.restore();
}
function wood(x,y,w,h,base){
  ctx.fillStyle=base; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(60,35,15,.16)'; ctx.lineWidth=1.2;
  for(let i=0;i<h;i+=9){ ctx.beginPath(); ctx.moveTo(x,y+i); for(let j=0;j<=w;j+=30) ctx.lineTo(x+j,y+i+Math.sin((j+i*7)*0.02)*2.2); ctx.stroke(); }
}
function drawBelt(){
  const be=BE(), ty=topY();
  wood(0,0,W,H,'#A8774A');
  ctx.fillStyle='#8E979A'; ctx.fillRect(8,ty,10,be-ty); ctx.fillRect(W-18,ty,10,be-ty);
  ctx.fillStyle='#3E4644'; ctx.fillRect(18,ty,W-36,be-ty);
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=2;
  const off=G.s%22;
  for(let y=ty+off-22;y<be;y+=22){ ctx.beginPath(); ctx.moveTo(18,y); ctx.lineTo(W-18,y); ctx.stroke(); }
  ctx.fillStyle='#6E7678';
  for(let y=ty+(G.s*0.5)%40;y<be;y+=40){ ctx.beginPath(); ctx.arc(13,y,3,0,Math.PI*2); ctx.arc(W-13,y,3,0,Math.PI*2); ctx.fill(); }
}
function drawPanel(){
  const be=BE();
  wood(0,be,W,H-be,'#8F6139');
  ctx.fillStyle='#5A3A20'; ctx.fillRect(0,be,W,5);
  // ハンコ立て・朱肉
  inkpad(150,be+118);
  // 印箱（校長印の置き場）
  ctx.fillStyle='#4A3424'; ctx.fillRect(22,be+114,80,38); ctx.fillStyle='#2E2016'; ctx.fillRect(27,be+119,70,28);
  // トレイ
  tray(186,be+64,104,H-be-74,'決裁済',G.docs.filter(o=>o.mark&&o.mark.k==='ok'&&!o.f.length).length);
  tray(302,be+64,108,H-be-74,'差戻',G.docs.filter(o=>o.inTray&&o.st==='gone').length);
  // 伝言メモ（事務長・監査のひと言があるときだけ机に置かれる）
  if(G.note){
    const a=Math.min(1,G.note.t/0.3);
    ctx.save(); ctx.globalAlpha=a; ctx.translate(0,(1-a)*8);
    ctx.fillStyle='rgba(40,25,10,.25)'; ctx.fillRect(15,be+13,W-24,46);
    ctx.fillStyle=G.note.kind==='bad'?'#FBEFF1':'#FBFAF3'; ctx.fillRect(12,be+10,W-24,46);
    ctx.strokeStyle='#D6CFBD'; ctx.strokeRect(12.5,be+10.5,W-25,45);
    const c=G.note.kind==='bad'?SHU:INK;
    const lines=wrap(G.note.text,W-48,13.5);
    lines.slice(0,2).forEach((l,j)=>txt(l,24,be+(lines.length>1?29:38)+j*19,13.5,{c,w:G.note.kind==='bad'?700:500}));
    ctx.restore();
  }
}
// 朱肉: 金属ケース入り・ふたが開いている
function inkpad(x,y){
  ctx.fillStyle='#8E9195'; ctx.beginPath(); ctx.ellipse(x,y-26,27,11,0,Math.PI,0); ctx.fill();          // 開いたふた
  ctx.fillStyle='#B4B7BA'; ctx.beginPath(); ctx.ellipse(x,y-26,23,8,0,Math.PI,0); ctx.fill();
  ctx.fillStyle='#7C7F83'; ctx.fillRect(x-27,y,54,10); ctx.beginPath(); ctx.ellipse(x,y+10,27,11,0,0,Math.PI); ctx.fill(); // 側面
  ctx.fillStyle='#C3C6C9'; ctx.beginPath(); ctx.ellipse(x,y,27,11,0,0,Math.PI*2); ctx.fill();            // ふち
  ctx.fillStyle='#A62F27'; ctx.beginPath(); ctx.ellipse(x,y,21,8,0,0,Math.PI*2); ctx.fill();             // 朱肉
  ctx.fillStyle='#8E2620'; ctx.beginPath(); ctx.ellipse(x+5,y+2,11,4,0,0,Math.PI*2); ctx.fill();
}
// 印鑑（柘植の柄を斜め上から）。(x,y)=印面の中心。tilt=傾き、lift=持ち上げ量
function hanko(x,y,tilt,lift,sc){
  ctx.save(); ctx.translate(x,y-lift); ctx.rotate(tilt); ctx.scale(sc||1,sc||1);
  ctx.fillStyle='#B8352B'; ctx.beginPath(); ctx.ellipse(0,0,16,6,0,0,Math.PI*2); ctx.fill();            // 印面の朱
  ctx.fillStyle='#C99E57'; ctx.beginPath();
  ctx.moveTo(-16,0); ctx.lineTo(-16,-14); ctx.quadraticCurveTo(-16,-26,-10,-34); ctx.lineTo(-10,-48);
  ctx.lineTo(10,-48); ctx.lineTo(10,-34); ctx.quadraticCurveTo(16,-26,16,-14); ctx.lineTo(16,0);
  ctx.ellipse(0,0,16,6,0,0,Math.PI); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#A9823F'; ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(16,0); ctx.lineTo(16,-14); ctx.quadraticCurveTo(16,-26,10,-34); ctx.lineTo(10,-48); ctx.lineTo(4,-48); ctx.lineTo(4,-34); ctx.quadraticCurveTo(8,-24,5,-14); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#D9B36C'; ctx.beginPath(); ctx.ellipse(0,-50,14,13,0,0,Math.PI*2); ctx.fill();          // 頭
  ctx.fillStyle='#BE9450'; ctx.beginPath(); ctx.ellipse(4,-48,9,10,0,-0.6,1.9); ctx.fill();
  ctx.fillStyle='#E6C98E'; ctx.beginPath(); ctx.ellipse(-4,-54,4,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#B8352B'; ctx.beginPath(); ctx.arc(0,-36,2.4,0,Math.PI*2); ctx.fill();                  // アタリ
  ctx.fillStyle='#FBFAF3'; ctx.fillRect(-7,-27,13,22); ctx.fillStyle=INK; ctx.font='700 9px '+MIN; ctx.textAlign='center'; ctx.fillText('大',-0.5,-18); ctx.fillText('森',-0.5,-8); // 名前シール
  ctx.strokeStyle='rgba(60,40,15,.45)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-15,-6); ctx.ellipse(0,-6,15,5.5,0,Math.PI,0,true); ctx.stroke();
  ctx.restore();
}
function tray(x,y,w,h,label,n){
  ctx.fillStyle='#5F6B70'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#4B5559'; ctx.fillRect(x+5,y+5,w-10,h-10);
  for(let i=0;i<Math.min(n,8);i++){ ctx.fillStyle=i%2?'#F4F1E6':'#FBFAF3'; ctx.save(); ctx.translate(x+w/2,y+h/2-i*1.5); ctx.rotate(((i*5)%7-3)*0.03); ctx.fillRect(-w/2+12,-h/2+10,w-24,h-20); ctx.restore(); }
  ctx.fillStyle='#F3EFE4'; ctx.fillRect(x+w/2-30,y+h-24,60,20);
  txt(label,x+w/2,y+h-9,13,{a:'center',w:700});
}
function wrap(s,maxW,size){
  ctx.font='700 '+size+'px '+FF; const out=[]; let cur='';
  for(const ch of s){ if(ctx.measureText(cur+ch).width>maxW){ out.push(cur); cur=ch; } else cur+=ch; }
  if(cur) out.push(cur); return out;
}
function drawStamp(){
  const st=G.stamp; if(!st)return;
  if(st.held){
    const sp=speedOf(st), k=Math.min(1.6,sp.v/TH), a=Math.atan2(sp.vy,sp.vx);
    // 印面の予告（遅い=くっきり / 速い=にじむ）
    if(k<0.75) seal(st.x,st.y,17*DS(),'大森',0.6,0);
    else for(let j=0;j<3;j++) seal(st.x-Math.cos(a)*j*6*k,st.y-Math.sin(a)*j*6*k,17*DS(),'大森',0.24,j*0.15*k);
    ctx.fillStyle='rgba(30,20,10,.22)'; ctx.beginPath(); ctx.ellipse(st.x+8,st.y+4,17,7,0,0,Math.PI*2); ctx.fill();
    hanko(st.x,st.y,Math.max(-0.6,Math.min(0.6,sp.vx/TH*0.35)),14,1.2);   // 速いほど進行方向へ傾く
    ctx.strokeStyle=k>=1?SHU:'rgba(255,255,255,.8)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(st.x,st.y,26,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,k)); ctx.stroke();
  }else{
    hanko(st.x,st.y-6,0,0,1.3);
  }
}
function draw(){
  const sh=G.shake>0?(Math.random()-0.5)*G.shake*22:0;
  ctx.save(); ctx.translate(sh,sh*0.4);
  drawBelt();
  const fx=G.fx;
  if(G.screen!=='title'){
    // ハンコが校長欄に重なっているか
    for(const o of G.docs) o.hot=false;
    if(G.stamp&&G.stamp.held) for(const o of G.docs){ if(o.st==='belt'&&inR(G.stamp,boxRect(o,0),8)&&boxRect(o,0).y+BOX.h*DS()/2<BE()) o.hot=true; }
    const vis=G.docs.filter(o=>o.st!=='gone'&&o.st!=='rej'&&o.st!=='held');
    for(const o of vis){ if(fx){ drawDoc(o,o.cx,o.cy,o.rr); continue; } const p=docPos(o); if(p.y>H||p.y+DH*DS()<0)continue; drawDoc(o,p.x,p.y,0); }
  }
  drawPanel();
  if(G.screen!=='title'){
    for(const o of G.docs) if(o.st==='rej'&&o.fly&&!fx) drawDoc(o,o.fly.x,o.fly.y,o.fly.r);
    for(const o of G.docs) if(o.st==='held'&&!fx) drawDoc(o,o.hx,o.hy,(o.hx-DX())*0.0012);
  }
  if(!fx) drawStamp();
  // 開始直後の案内（数秒で消える）
  if(G.screen==='play'&&G.day===0&&G.t<4.5){
    const be=BE(), a=Math.min(1,(4.5-G.t)/0.6);
    ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle='#F3EFE4'; ctx.lineWidth=2; ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.moveTo(62,be-6); ctx.lineTo(62,be-130); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(240,be-150); ctx.lineTo(352,be+60); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }
  if(fx){
    for(const n of fx.notes){ const t=fx.t-n.d; if(t<=0)continue; const a=Math.min(1,t/0.18), s=1+(1-a)*0.8;
      ctx.save(); ctx.translate(n.x,n.y-(1-a)*40); ctx.rotate(n.r); ctx.scale(s,s);
      ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(-n.w/2+2,-n.w/2+3,n.w,n.w);
      ctx.fillStyle=n.c; ctx.fillRect(-n.w/2,-n.w/2,n.w,n.w); ctx.fillStyle='rgba(0,0,0,.07)'; ctx.fillRect(-n.w/2,-n.w/2,n.w,8);
      ctx.strokeStyle='rgba(34,32,28,.45)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-n.w/2+8,-4); ctx.lineTo(n.w/2-10,-4); ctx.moveTo(-n.w/2+8,6); ctx.lineTo(n.w/2-18,6); ctx.stroke();
      ctx.restore(); }
    if(fx.t>0.55){ const t=Math.min(1,(fx.t-0.55)/0.16), s=2.4-1.4*t;
      ctx.save(); ctx.translate(W/2,H*0.42); ctx.rotate(-0.14); ctx.scale(s,s); ctx.globalAlpha=0.35+0.6*t;
      ctx.strokeStyle=SHU; ctx.lineWidth=9; ctx.strokeRect(-72,-72,144,144); ctx.lineWidth=3; ctx.strokeRect(-60,-60,120,120);
      ctx.fillStyle=SHU; ctx.font='800 50px '+MIN; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('監',0,-24); ctx.fillText('査',0,28); ctx.textBaseline='alphabetic'; ctx.restore(); }
  }
  ctx.restore();
  if(G.screen==='play'||G.screen==='pause'||G.fx){
    const D=DAYS[G.day], left=G.docs.filter(o=>o.st==='belt'||o.st==='held').length;
    UI.hud(D.name,fmtD(D.md),'残り'+left+'件　メモ'+(G.miss?'<span class="warn">'+G.miss+'</span>':'0')+'/3');
  }
}

// ---- メインループ ----
function frame(ts){
  const dt=lastTs?Math.min((ts-lastTs)/1000,0.05):0; lastTs=ts;
  if(G.screen==='play') update(dt);
  else if(G.screen==='result'){ updateFx(dt); if(G.shake>0&&!G.fx)G.shake=Math.max(0,G.shake-dt); }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=getComputedStyle(document.body).backgroundColor; ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,TX*DPR,TY*DPR);
  draw();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize); resize();
showTitle();
requestAnimationFrame(frame);
</script>
