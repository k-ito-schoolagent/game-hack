<style>
/* ================================================================
 * GAME HACK 共通UI（ここから）— 全ゲームで同じものをコピーして使う
 * 世界観: 業務帳票。紙 × 墨 × 朱（ハンコの赤）。
 * - 朱は「判子」と「失敗」にだけ使う。ボタンや装飾には使わない
 * - 角丸は 2px まで。影・グラデーション・絵文字は使わない
 * ================================================================ */
:root{
  --paper:#F3EFE4; --paper2:#E8E1CF; --ink:#22201C; --ink2:#5E584D; --rule:#CDC3AC; --shu:#C8372D;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDGothic","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--scene,#2b2a27);font-family:var(--font);color:var(--ink);-webkit-text-size-adjust:100%}
#wrap{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
/* HUD: 帳票の見出し帯。左=どこ / 中=いまの数値 / 右=一時停止 */
#hud{position:absolute;left:0;right:0;top:0;padding-top:var(--safe-t);background:var(--paper);border-bottom:1px solid var(--ink);display:none;grid-template-columns:1fr auto 52px;align-items:center;height:calc(48px + var(--safe-t));box-sizing:border-box;font-feature-settings:"tnum";z-index:5}
#hud.on{display:grid}
#hudL{padding-left:14px;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudL small{font-weight:500;color:var(--ink2);font-size:12px;margin-left:6px}
#hudC{padding:0 12px;font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
#hudC .warn{color:var(--shu)}
#pauseBtn{width:52px;height:48px;border:0;border-left:1px solid var(--rule);background:transparent;display:grid;place-items:center}
#pauseBtn i{display:block;width:12px;height:14px;border-left:4px solid var(--ink);border-right:4px solid var(--ink);box-sizing:border-box}
/* シート: 下から出る帳票。親指で押せる位置にボタンを置く */
#sheetBg{position:absolute;inset:0;background:rgba(34,32,28,.5);display:none;z-index:10}
#sheetBg.on{display:block}
#sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,460px);max-height:calc(100% - 24px - var(--safe-t));overflow:auto;box-sizing:border-box;background:var(--paper);border-top:3px solid var(--ink);padding:22px 20px calc(18px + var(--safe-b));animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#sheet .no{font-size:11.5px;letter-spacing:.14em;color:var(--ink2);margin:0 0 6px}
#sheet h1{font-size:26px;line-height:1.3;margin:0 0 4px;letter-spacing:.02em;padding-right:96px}
#sheet .lead{font-size:15px;line-height:1.75;margin:14px 0 14px;white-space:pre-line}
#sheet dl{margin:0 0 18px;border-top:1px solid var(--ink)}
#sheet dl div{display:grid;grid-template-columns:7.5em 1fr;border-bottom:1px solid var(--rule);padding:9px 0;font-size:14px;line-height:1.6}
#sheet dt{color:var(--ink2)}
#sheet dd{margin:0;font-weight:600;font-feature-settings:"tnum"}
#sheet .acts{display:grid;gap:8px}
.btn{height:54px;border:0;border-radius:2px;background:var(--ink);color:var(--paper);font-size:16px;font-weight:700;letter-spacing:.06em}
.btn:focus-visible,.sub button:focus-visible,#pauseBtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn:active{transform:translateY(1px);opacity:.9}
.sub{display:flex;flex-wrap:wrap;justify-content:center;gap:0 4px}
.sub button{min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--ink);font-size:14px;text-decoration:underline;text-underline-offset:3px}
/* 判子: 結果シートの右上に押される。中身は最大4字 */
.stamp{position:absolute;top:12px;right:16px;width:76px;height:76px;border:4px solid var(--shu);border-radius:6px;color:var(--shu);display:grid;place-items:center;font-weight:800;line-height:1.05;text-align:center;transform:rotate(-8deg);opacity:.92;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--shu);animation:stampIn .32s cubic-bezier(.3,1.6,.5,1) .12s both}
.stamp.round{border-radius:50%}
.stamp span{display:block}
@keyframes stampIn{from{transform:rotate(-8deg) scale(1.9);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.92}}
@media (prefers-reduced-motion:reduce){#sheet,.stamp{animation:none}}
/* ===== GAME HACK 共通UI（ここまで）===== */

:root{--scene:#d9d4bd}
/* 区分棚のケース（DOM）。位置は JS が決める */
.basket{position:absolute;z-index:2;margin:0;padding:15px 4px 4px;border:2px solid #3f2c1a;border-radius:2px;background:#a67a49;color:#2a1d10;text-align:center;line-height:1.2;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;touch-action:none}
.basket::before{content:'';position:absolute;left:0;right:0;top:0;height:11px;background:#2b1f14}
.basket b{display:block;font-size:15px;font-weight:800;background:#f1ead2;border:1.5px solid #b08d3c;padding:2px 6px;margin-bottom:2px;white-space:nowrap}
.basket small{display:block;white-space:nowrap;font-size:9px;font-weight:600;color:#3a2a18}
.basket .plate{position:absolute;left:3px;top:13px;width:16px;height:16px;border-radius:50%;background:#c9a64a;border:1px solid #6b5420;color:#2a1d10;font:800 10px/14px var(--font);font-style:normal;text-align:center}
.basket.tsujo{background:#77756f;border-color:#2e2d2a}
.basket.tsujo b{background:#e6e3da;border-color:#8f8d88}
.basket.hot{outline:3px solid #f2d36b;outline-offset:1px;transform:translateY(-3px)}
.basket.got{outline:3px solid #f1ead2;outline-offset:1px}

/* ===== ゲーム固有の見た目: 郵便局 区分課の業務日報 ===== */
:root{--paper:#F6F0DA;--paper2:#EAE1C0;--ink:#2a2418;--ink2:#6a5f46;--rule:#b9ad88;--font:"Hiragino Mincho ProN","Yu Mincho","BIZ UDMincho","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",serif}
#hud{background:#2b3a30;border-bottom:3px solid #b8964a;color:#f3ecd0}
#hudL small{color:#cfc6a0}
#hudC .warn{color:#ff9a8a}
#pauseBtn{border-left:1px solid #55664f}
#pauseBtn i{border-left-color:#f3ecd0;border-right-color:#f3ecd0}
#sheet{border-top:6px double var(--ink);background:var(--paper);font-family:var(--font)}
#sheet .no{font-size:11.5px;letter-spacing:.2em;margin-bottom:10px}
#sheet h1{font-weight:800;letter-spacing:.06em}
#sheet dl{border-top:2px solid var(--ink)}
#sheet dl div{border-bottom:1px dashed var(--ink2)}
#sheet dt{letter-spacing:.1em}
.btn{background:#2b3a30;color:#f3ecd0}
.stamp.round{color:#2a3a5c;border-color:#2a3a5c;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px #2a3a5c;font-family:var(--font)}
.stamp{font-family:var(--font)}
#hudL::before{content:'〒';color:#e0554a;font-weight:800;margin-right:7px}
#sheet{border:1px solid var(--ink);border-top:6px double var(--ink);box-shadow:none}
#sheet .no{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
#sheet .no::before{content:'〒';color:var(--shu);font-size:17px;font-weight:800;letter-spacing:0}
#sheet dt{border-right:1px solid var(--ink2);margin-right:10px}
#sheet dl div{grid-template-columns:6.5em 1fr}
.stamp{width:88px;height:88px;border-radius:50%;top:8px;right:14px}
.stamp::before{content:'区分課';position:absolute;top:10px;left:0;right:0;font-size:9px;letter-spacing:.25em;font-weight:700}
.stamp::after{content:var(--d,'');position:absolute;bottom:9px;left:0;right:0;font-size:10px;letter-spacing:.12em;font-weight:700}
.stamp.round{border-radius:50%}
#sheet h1{padding-right:104px}
.stamp.bad{color:var(--shu);border-color:var(--shu);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--shu)}
</style>

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <!-- 共通UI: ここから -->
  <div id="hud"><div id="hudL"></div><div id="hudC"></div><button id="pauseBtn" aria-label="一時停止"><i></i></button></div>
  <div id="sheetBg"><div id="sheet" role="dialog" aria-modal="true"></div></div>
  <!-- 共通UI: ここまで -->
</div>
<script>
'use strict';
// ================================================================
// GAME HACK 共通UI（ここから）— 書き換えずにコピーする
// ================================================================
// 論理座標: 横幅 W=420 固定。高さ H は端末の縦横比に合わせて 700〜920 で伸びる（上下の黒帯を出さない）
// 描画は H を見てレイアウトする（上端=HUD 下、下端=親指ゾーン）
const W=420; let H=760;
const HUD_H=48;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let DPR=1,SC=1,TX=0,TY=0,VW=0,VH=0,SAFE_T=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  H=Math.max(700,Math.min(920,Math.round(W*VH/VW)));
  SC=Math.min(VW/W,VH/H); TX=(VW-W*SC)/2; TY=(VH-H*SC)/2;
  SAFE_T=(parseFloat(getComputedStyle($('hud')).paddingTop)||0)/SC;
  if(typeof onResize==='function')onResize();
}
// 画面座標 → 論理座標
function toGame(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left-TX)/SC, y:(e.clientY-r.top-TY)/SC}; }
// DOM 要素の中心 → 論理座標（下部ボタンとの距離判定などに使う）
function elCenter(el){ const r=el.getBoundingClientRect(); return toGame({clientX:r.left+r.width/2,clientY:r.top+r.height/2}); }
// HUD の下端（論理座標）。ゲームの描画はここから下に置く
function topY(){ return HUD_H+SAFE_T; }
// 振動（対応端末のみ）
function buzz(ms){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(_){} }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const UI={
  hud(l,lSmall,c){ $('hud').classList.add('on'); $('hudL').innerHTML=esc(l)+(lSmall?'<small>'+esc(lSmall)+'</small>':''); $('hudC').innerHTML=c||''; },
  hideHud(){ $('hud').classList.remove('on'); },
  /* シートを開く
   * o = { no:'No.01 · 乗務報告', title, lead, rows:[[ラベル,値],...], stamp:'不可'|'発車'(最大4字), round:true(丸印),
   *       main:[ラベル,fn], subs:[[ラベル,fn],...] } */
  sheet(o){
    const s=$('sheet');
    let h='';
    if(o.stamp){ const t=[...o.stamp]; const lines=t.length===4?[t.slice(0,2).join(''),t.slice(2).join('')]:t.length===3?[t.join('')]:[t.join('')];
      const fs=t.length<=2?27:t.length===3?20:22;
      h+='<div class="stamp'+(o.round?' round':'')+'" style="font-size:'+fs+'px">'+lines.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>'; }
    if(o.no)h+='<p class="no">'+esc(o.no)+'</p>';
    h+='<h1>'+esc(o.title)+'</h1>';
    if(o.lead)h+='<p class="lead">'+esc(o.lead)+'</p>';
    if(o.rows&&o.rows.length)h+='<dl>'+o.rows.map(r=>'<div><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>').join('')+'</dl>';
    h+='<div class="acts">';
    if(o.main)h+='<button class="btn" data-k="main">'+esc(o.main[0])+'</button>';
    // 𝕏 の共有ボタンがあれば、その隣に Facebook の共有を足す
    if(o.subs){ const i=o.subs.findIndex(b=>/𝕏/.test(b[0])); if(i>=0&&!o.subs.some(b=>/Facebook/.test(b[0]))) o.subs=[...o.subs.slice(0,i+1),['Facebookで共有',shareFB],...o.subs.slice(i+1)]; }
    if(o.subs&&o.subs.length)h+='<div class="sub">'+o.subs.map((b,i)=>'<button data-k="s'+i+'">'+esc(b[0])+'</button>').join('')+'</div>';
    h+='</div>';
    s.innerHTML=h; s.scrollTop=0;
    s.querySelectorAll('button').forEach(b=>{
      const k=b.dataset.k, fn=k==='main'?o.main[1]:o.subs[+k.slice(1)][1];
      b.addEventListener('click',e=>{ e.stopPropagation(); fn(); });
    });
    $('sheetBg').classList.add('on');
    const m=s.querySelector('.btn'); if(m)setTimeout(()=>m.focus({preventScroll:true}),50);
  },
  close(){ $('sheetBg').classList.remove('on'); },
  open(){ return $('sheetBg').classList.contains('on'); },
};
// 共有（𝕏）とポータルへ
function shareX(text,tag){ window.open('https://x.com/intent/post?text='+encodeURIComponent(text+'\n\n#'+tag+' #GAMEHACK\n'+location.href.split('#')[0]),'_blank','noopener'); }
function shareFB(){ window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href.split('#')[0]),'_blank','noopener'); }
function toPortal(){ location.href='../../'; }
// 一時停止: HUD 右の ‖ / タブ切替で自動停止 / Esc
let pausedFrom=null;
function pause(){
  if(G.screen!=='play')return;
  pausedFrom='play'; G.screen='pause';
  UI.sheet({no:GAME_NO+' · 一時停止中',title:'一時停止',main:['再開する',resume],subs:[['この面をやり直す',()=>{UI.close();restart();}],['一覧へ戻る',toPortal]]});
}
function resume(){ if(G.screen!=='pause')return; UI.close(); G.screen='play'; lastTs=0; }
$('pauseBtn').addEventListener('click',e=>{ e.stopPropagation(); G.screen==='pause'?resume():pause(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden)pause(); });
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ G.screen==='pause'?resume():pause(); } });

// ---- はがきを棚へ送る（タップもフリックも同じ1操作）----
function judge(id){
  if(G.screen!=='play')return; const c=G.card; if(!c||c.state!=='idle')return;
  const b=BK[id], ok=id===c.basket;
  G.drag=null; setHot(null);
  c.state='fly'; c.from={x:c.x,y:c.y}; c.to={x:b.cx,y:b.cy}; c.t=0; c.vr=ok?5:-7; c.dest=id; c.ok=ok;
  G.flying.push(c); G.card=null; G.next=0.34;
  if(ok){
    G.done++; G.combo++; G.best=Math.max(G.best,G.combo); buzz(8);
    c.land=()=>{ b.el.classList.add('got'); setTimeout(()=>b.el.classList.remove('got'),220); };
  }else{
    G.combo=0; G.miss++; G.shake=0.4; buzz(40);
    const label=(c.mourning?'喪中の':'')+c.pref+'→'+b.name;
    G.missList.push(label); G.lastMiss={kind:'mis',card:c,dest:id};
    c.land=()=>{ G.stamps.push({x:b.cx,y:b.cy,t:0,text:'誤配',big:false}); G.ring=1.8; addNote('誤配',c.pref); };
    if(G.miss>=MAX_MISS)failStart();
  }
}
function timeout(){
  const c=G.card; G.combo=0; G.miss++; G.shake=0.4; buzz(40);
  c.state='drop'; c.vy=-120; c.vx=(c.x<G.home.x?-40:40); c.vr=2.4; G.flying.push(c); G.card=null; G.next=0.34; G.drag=null; setHot(null);
  G.missList.push(c.pref+'（滞留）'); G.lastMiss={kind:'time',card:c};
  G.bubble={text:'局長「まだ終わらんのか！」',t:1.7}; G.ring=1.8; addNote('滞留',c.pref);
  if(G.miss>=MAX_MISS)failStart();
}

// ---- 入力: 弾いた向きにある棚を選ぶ ----
function bestBasket(vx,vy){
  const h=G.home, vl=Math.hypot(vx,vy); let best=null,bd=9;
  for(const id of ORDER){
    const b=BK[id], dx=b.cx-h.x, dy=b.cy-h.y;
    const cos=(vx*dx+vy*dy)/(vl*Math.hypot(dx,dy)), a=Math.acos(Math.max(-1,Math.min(1,cos)));
    if(a<bd){bd=a;best=id;}
  }
  return best;
}
function dragMove(p){
  const d=G.drag, c=G.card; if(!d||!c||c.state!=='idle')return;
  const vx=p.x-d.x0, vy=p.y-d.y0, len=Math.hypot(vx,vy);
  if(len>TH){ d.cand=bestBasket(vx,vy); setHot(d.cand); }else{ d.cand=null; setHot(null); }
  const lim=Math.min(len,64), k=len?lim/len:0;
  c.x=G.home.x+vx*k; c.y=G.home.y+vy*k; c.rot=Math.max(-0.35,Math.min(0.35,vx/260));
}
$('wrap').addEventListener('pointerdown',e=>{
  if(G.screen!=='play'||!G.card||G.card.state!=='idle'||e.target.closest('.basket')||e.target.closest('#hud'))return;
  const p=toGame(e); G.drag={id:e.pointerId,x0:p.x,y0:p.y,cand:null};
  try{$('wrap').setPointerCapture(e.pointerId);}catch(_){}
});
$('wrap').addEventListener('pointermove',e=>{ if(G.drag&&e.pointerId===G.drag.id)dragMove(toGame(e)); });
function dragEnd(e,cancel){
  const d=G.drag; if(!d||e.pointerId!==d.id)return;
  G.drag=null; setHot(null);
  if(!cancel&&d.cand&&G.card&&G.screen==='play'){ judge(d.cand); return; }
  if(G.card){ G.card.x=G.home.x; G.card.y=G.home.y; G.card.rot=0; }
}
$('wrap').addEventListener('pointerup',e=>dragEnd(e,false));
$('wrap').addEventListener('pointercancel',e=>dragEnd(e,true));
window.addEventListener('keydown',e=>{ const i='12345'.indexOf(e.key); if(i>=0&&e.key.length===1)judge(ORDER[i]); });

// ---- 更新 ----
function update(dt){
  const c=G.card;
  if(c){
    if(c.pop<1)c.pop=Math.min(1,c.pop+dt/0.14);
    if(c.state==='idle'){ G.timer-=dt; if(G.timer<=0)timeout(); }
  }else if(G.next>0){
    G.next-=dt; if(G.next<=0)nextCard();
  }
}
function animate(dt){
  G.clock+=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt);
  if(G.ring>0&&G.ring<90)G.ring=Math.max(0,G.ring-dt);
  if(G.bubble){ G.bubble.t-=dt; if(G.bubble.t<=0)G.bubble=null; }
  for(const c of G.flying){
    if(c.state==='fly'){
      c.t=Math.min(1,c.t+dt/0.3); const e=1-Math.pow(1-c.t,2);
      c.x=c.from.x+(c.to.x-c.from.x)*e; c.y=c.from.y+(c.to.y-c.from.y)*e-Math.sin(Math.PI*c.t)*50;
      c.sc=1-0.55*e; c.rot+=c.vr*dt;
      if(c.t>=1&&!c.done){ c.done=true; c.land&&c.land(); }
    }else{ c.vy+=1500*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.rot+=c.vr*dt; }
  }
  G.flying=G.flying.filter(c=>c.state==='fly'?!c.done:c.y<H+200);
  for(const s of G.stamps)s.t+=dt; G.stamps=G.stamps.filter(s=>s.t<1.1);
  for(const n of G.notes)n.t+=dt;
  if(G.screen==='fail'){ G.fxT+=dt; if(G.fxT>1.2&&G.screen==='fail'){ G.screen='fx'; failSheet(); } }
  if(G.screen==='clear'){ G.fxT+=dt; if(G.fxT>1.1){ G.screen='fx'; clearSheet(); } }
}

// ---- 描画 ----
function vtext(s,x,y,fs,col,wt){
  ctx.fillStyle=col; ctx.strokeStyle=col; ctx.font=(wt||600)+' '+fs+'px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
  const step=fs*1.04;
  [...s].forEach((ch,i)=>{
    const yy=y+i*step+step/2;
    if(ch==='ー'){ ctx.lineWidth=Math.max(1,fs*0.09); ctx.beginPath(); ctx.moveTo(x,yy-fs*0.32); ctx.lineTo(x,yy+fs*0.32); ctx.stroke(); }
    else ctx.fillText(ch,x,yy);
  });
}
const kn=s=>s.replace(/\d/g,d=>'〇一二三四五六七八九'[d]).replace(/-/g,'ー');
function chunk(s){
  const a=[...s], n=Math.ceil(a.length/9), size=Math.ceil(a.length/n), out=[]; let p=0;
  while(a.length-p>Math.min(9,size+2)){
    let cut=size;
    for(let d=0;d<=2;d++){ const i=p+size-d; if('市区郡'.includes(a[i-1])){cut=size-d;break;} }
    out.push(a.slice(p,p+cut).join('')); p+=cut;
  }
  out.push(a.slice(p).join('')); return out;
}
function drawCard(c){
  const CWd=260,CHd=176;
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot||0);
  const sc=(CW/CWd)*(c.sc||1)*(c.pop!==undefined&&c.state==='idle'?0.92+0.08*c.pop:1); ctx.scale(sc,sc);
  const m=c.mourning;
  ctx.fillStyle='rgba(40,28,14,.22)'; ctx.fillRect(-CWd/2+2,-CHd/2+3,CWd,CHd);
  ctx.fillStyle=m?'#f2efe6':'#fbf7ea'; ctx.fillRect(-CWd/2,-CHd/2,CWd,CHd);
  ctx.lineWidth=1; ctx.strokeStyle='#cfc6ad'; ctx.strokeRect(-CWd/2+.5,-CHd/2+.5,CWd-1,CHd-1);
  if(m){ ctx.lineWidth=3; ctx.strokeStyle='#8f8d88'; ctx.strokeRect(-CWd/2+4,-CHd/2+4,CWd-8,CHd-8); }
  // 料額印面（左上）と「年賀」の朱書き（印面の下）
  const sx=-CWd/2+10, sy=-CHd/2+10;
  ctx.lineWidth=2.2; ctx.strokeStyle='#d2452f'; ctx.strokeRect(sx,sy,32,38);
  ctx.fillStyle='#d2452f'; ctx.font='800 14px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('85',sx+16,sy+19);
  if(m){ ctx.font='600 7.5px '+FONT; ctx.fillStyle='#7a6c66'; ctx.fillText('郵便はがき',sx+19,sy+50); }
  else{ ctx.fillStyle='#d2452f'; ctx.font='800 14px '+FONT; ctx.fillText('年賀',sx+16,sy+52); }
  // 郵便番号 7桁の赤枠（右上）
  const z=c.zip.replace('-','');
  ctx.font='700 11px '+FONT;
  for(let i=0;i<7;i++){
    const bx=CWd/2-10-7*13+i*13, by=-CHd/2+(m?12:9);
    ctx.lineWidth=1; ctx.strokeStyle='#d2452f'; ctx.strokeRect(bx,by,12,17);
    ctx.fillStyle='#2a2420'; ctx.fillText(z[i],bx+6,by+9);
  }
  // 宛名（縦書き・右端から）
  chunk(kn(c.addr)).forEach((l,i)=>vtext(l,CWd/2-24-i*16,-CHd/2+38,13.5,'#2a2420',600));
  vtext(c.name,30,-CHd/2+34,24,'#1c1814',700);
  if(m){
    ['喪中につき','年末年始のご挨拶を','失礼させていただきます'].forEach((l,i)=>vtext(l,-76+i*13,-52,9,'#6f6c66',500));
  }else{
    // 差出人（左下）と小さな郵便番号枠
    vtext('森山健二',-CWd/2+16,8,9.5,'#6b6458',500);
    ctx.lineWidth=0.8; ctx.strokeStyle='#d2452f'; for(let i=0;i<7;i++)ctx.strokeRect(-CWd/2+8+i*7.4,CHd/2-18,6.6,9);
  }
  ctx.restore();
}
function drawStamp(x,y,text,sz,a){
  ctx.save(); ctx.translate(x,y); ctx.rotate(-0.2); ctx.globalAlpha=a;
  ctx.strokeStyle='#C8372D'; ctx.fillStyle='#C8372D'; ctx.lineWidth=sz*0.09; ctx.strokeRect(-sz*0.9,-sz*0.5,sz*1.8,sz);
  ctx.font='800 '+Math.round(sz*0.7)+'px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,0,2);
  ctx.restore();
}
function drawPhone(x,y,big){
  const ringing=G.ring>0, sh=ringing?Math.sin(G.clock*70)*(big?4:2.2):0;
  ctx.save(); ctx.translate(x+sh,y);
  ctx.fillStyle='#2f2c29'; ctx.fillRect(0,18,76,36);                  // 本体
  ctx.fillStyle='#3c3835'; ctx.fillRect(-4,6+(ringing?-2:0),84,14);    // 受話器
  ctx.fillStyle='#bdb7a8'; ctx.beginPath(); ctx.arc(38,37,11,0,7); ctx.fill();
  ctx.fillStyle='#2f2c29'; ctx.beginPath(); ctx.arc(38,37,4,0,7); ctx.fill();
  ctx.strokeStyle='#8a8478'; ctx.lineWidth=1.5; for(let i=0;i<6;i++){ const a=i*1.0+0.4; ctx.beginPath(); ctx.arc(38+Math.cos(a)*8,37+Math.sin(a)*8,1.6,0,7); ctx.stroke(); }
  if(ringing){
    ctx.strokeStyle='#3a342c'; ctx.lineWidth=2; ctx.globalAlpha=0.55+0.4*Math.sin(G.clock*30);
    for(let k=0;k<2;k++){ ctx.beginPath(); ctx.arc(38,12,36+k*10,Math.PI*1.18,Math.PI*1.82); ctx.stroke(); }
    ctx.globalAlpha=1; ctx.fillStyle='#3a342c'; ctx.font='800 '+(big?15:12)+'px '+FONT; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(G.clock%0.5<0.25?'リリリリ…':'リリリ…!',84,14);
  }
  ctx.restore();
}
function drawNote(x,y,rot,sz,kind,pref){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(sz,sz);
  ctx.fillStyle='rgba(40,28,14,.2)'; ctx.fillRect(-27,-22,60,50);
  ctx.fillStyle='#f4dc6a'; ctx.fillRect(-30,-25,60,50);
  ctx.fillStyle='#e8cb52'; ctx.fillRect(-30,-25,60,6);
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#b32a22'; ctx.font='800 14px '+FONT; ctx.fillText(kind,0,-7);
  ctx.fillStyle='#3a3226'; ctx.font='700 11px '+FONT; ctx.fillText(pref,0,12);
  ctx.restore();
}
function drawBubble(text,cx,cy){
  const lines=text.split('\n'); ctx.font='700 13px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
  const w=Math.min(196,Math.max(...lines.map(l=>ctx.measureText(l).width))+22), h=lines.length*18+14;
  ctx.fillStyle='#fffdf3'; ctx.strokeStyle='#3a3226'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.rect(cx-w/2,cy-h/2,w,h); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-8,cy+h/2); ctx.lineTo(cx,cy+h/2+9); ctx.lineTo(cx+8,cy+h/2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#1c1814'; lines.forEach((l,i)=>ctx.fillText(l,cx,cy-h/2+7+9+i*18));
}
// 失敗演出の付箋（決め打ちの位置）
const AVAL=Array.from({length:16},(_,i)=>({x:30+((i*83)%360),y:150+((i*127)%420),r:((i*37)%50-25)/100}));
function draw(){
  const T=topY(), hx=G.home.x, hy=G.home.y;
  ctx.save();
  if(G.shake>0||G.screen==='fail')ctx.translate((Math.random()-.5)*(G.screen==='fail'?7:G.shake*14),(Math.random()-.5)*(G.screen==='fail'?5:G.shake*8));
  // 壁
  ctx.fillStyle='#d9d4bd'; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle='#cdc7ae'; ctx.lineWidth=1; for(let y=T+30;y<H;y+=44){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  // 区分棚の枠板
  for(const id of ORDER){ const b=BK[id]; if(!b.w)continue;
    ctx.fillStyle='#6e4f2e'; ctx.fillRect(b.x-6,b.y-6,b.w+12,b.h+12);
    ctx.fillStyle='#8a6540'; ctx.fillRect(b.x-10,b.y+b.h+6,b.w+20,7); }
  // 作業台
  const tx=10,ty=Math.max(hy-CH/2-24,hy-G.ry*0.5+48),tw=W-20,th=hy+CH/2+24-ty;
  ctx.fillStyle='#b78b59'; ctx.fillRect(tx,ty,tw,th);
  ctx.strokeStyle='rgba(120,84,46,.35)'; ctx.lineWidth=1; for(let y=ty+14;y<ty+th;y+=17){ ctx.beginPath(); ctx.moveTo(tx,y+((y*7)%5)); ctx.lineTo(tx+tw,y-((y*3)%5)); ctx.stroke(); }
  ctx.fillStyle='#8f6a40'; ctx.fillRect(tx,ty+th,tw,9);
  // 残りの束
  if(G.screen==='play'||G.screen==='pause'||G.screen==='fail'||G.screen==='clear'){
    const r=Math.max(0,remaining()-(G.card?1:0)); const n=Math.min(5,r);
    for(let i=n;i>=1;i--){
      ctx.save(); ctx.translate(hx+i*2.4,hy+i*2.4); ctx.rotate(i%2?0.012:-0.012);
      ctx.fillStyle='#f1ecda'; ctx.fillRect(-CW/2,-CH/2,CW,CH); ctx.strokeStyle='#cfc6ad'; ctx.strokeRect(-CW/2+.5,-CH/2+.5,CW-1,CH-1); ctx.restore();
    }
  }
  // 電話・日めくり
  drawPhone(14,T+8,G.screen==='fail');
  ctx.fillStyle='#f4f0e2'; ctx.fillRect(316,T+8,92,62); ctx.strokeStyle='#6b5a44'; ctx.lineWidth=1; ctx.strokeRect(316.5,T+8.5,91,61);
  ctx.fillStyle='#5a4a38'; ctx.fillRect(316,T+8,92,16);
  ctx.fillStyle='#f4f0e2'; ctx.font='700 11px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('12月',362,T+16);
  ctx.fillStyle='#1c1814'; ctx.font='800 32px '+FONT; ctx.fillText(DAYS[G.stage].name.replace(/12月|日/g,''),362,T+47);
  // 付箋（ミスのたびに机の下に貼られる）
  const nyB=hy-G.ry*0.5-68;
  G.notes.forEach((n,i)=>{ const p=Math.min(1,n.t/0.18), P=[[44,nyB,-0.12],[106,nyB-3,0.1],[368,nyB,0.14]][i]||[368,nyB,0];
    drawNote(P[0],P[1]-(1-p)*30,P[2],0.85+0.3*(1-p),n.kind,n.pref); });
  // 札
  for(const c of G.flying)drawCard(c);
  if(G.card)drawCard(G.card);
  // 制限時間（作業台の手前に細い帯）
  if(G.screen==='play'&&G.card){
    const f=Math.max(0,G.timer/DAYS[G.stage].limit);
    ctx.fillStyle='rgba(60,40,20,.35)'; ctx.fillRect(tx,ty+th+12,tw,5);
    ctx.fillStyle=f>0.35?'#3d6b3a':'#d9822b'; ctx.fillRect(tx,ty+th+12,tw*f,5);
  }
  // 吹き出し
  if(G.bubble)drawBubble(G.bubble.text,hx,ty-34);
  // 棚の誤配判子
  for(const s of G.stamps)drawStamp(s.x,s.y,s.text,22,Math.max(0,1-s.t/1.1));
  // 演出
  if(G.screen==='fail'){
    const t=G.fxT;
    if(t>0){ AVAL.forEach((a,i)=>{ const p=Math.max(0,Math.min(1,(t-i*0.035)/0.35)); if(p<=0)return;
      drawNote(a.x,-40+(a.y+40)*(1-Math.pow(1-p,3)),a.r,1.3,'苦情','電話'); }); }
    if(t>0.4){ const p=Math.min(1,(t-0.4)/0.18); drawStamp(hx,hy,G.lastMiss&&G.lastMiss.kind==='time'?'滞留':'誤配',70*(1+1.2*(1-p)),Math.min(1,p*1.3)*0.92); }
  }
  if(G.screen==='clear'&&G.fxT>0.2){
    const p=Math.min(1,(G.fxT-0.2)/0.2); ctx.save(); ctx.translate(hx,hy); ctx.rotate(-0.14); const r=64*(1+0.8*(1-p));
    ctx.globalAlpha=p*0.92; ctx.strokeStyle='#C8372D'; ctx.fillStyle='#C8372D'; ctx.lineWidth=r*0.1;
    ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke(); ctx.beginPath(); ctx.arc(0,0,r*0.86,0,7); ctx.lineWidth=r*0.025; ctx.stroke();
    ctx.font='800 '+Math.round(r*0.62)+'px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('完了',0,3); ctx.restore();
  }
  ctx.restore();
  if(G.screen==='play'||G.screen==='pause'||G.screen==='fail'||G.screen==='clear'){
    const w=G.miss>=2?'<span class="warn">ミス '+G.miss+'/'+MAX_MISS+'</span>':'ミス '+G.miss+'/'+MAX_MISS;
    UI.hud(DAYS[G.stage].name,(G.stage+1)+'/'+DAYS.length,'残り '+remaining()+' 通　'+w);
  }
}

// ---- メインループ ----
function frame(ts){
  const dt=lastTs?Math.min((ts-lastTs)/1000,0.05):0; lastTs=ts;
  if(G.screen!=='pause'){ if(G.screen==='play')update(dt); animate(dt); }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=getComputedStyle(document.body).backgroundColor; ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,TX*DPR,TY*DPR);
  draw();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize); resize();
showTitle();
requestAnimationFrame(frame);

</script>
</body>
