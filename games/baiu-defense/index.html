<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>梅雨前線ディフェンス | GAME HACK</title>

<meta property="og:description" content="太平洋高気圧になって、北上する梅雨前線を天気図の上でせき止める。押しすぎると別の地方が大雨、届かれると「梅雨入りしたと見られます」。">
<meta property="og:site_name" content="GAME HACK">
<meta name="description" content="太平洋高気圧になって、北上する梅雨前線を天気図の上でせき止める。押しすぎると別の地方が大雨、届かれると「梅雨入りしたと見られます」。">
<meta name="theme-color" content="#E9EEEC">
<!-- ファビコン: GAME HACK 共通の朱の角印。文字（1字）だけ差し替える -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%226%22 fill=%22none%22 stroke=%22%23C8372D%22 stroke-width=%226%22/><text x=%2232%22 y=%2244%22 font-size=%2234%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%23C8372D%22>梅</text></svg>">
<style>
/* ================================================================
 * GAME HACK 共通UI（ここから）— 全ゲームで同じものをコピーして使う
 * 世界観: 業務帳票。紙 × 墨 × 朱（ハンコの赤）。
 * - 朱は「判子」と「失敗」にだけ使う。ボタンや装飾には使わない
 * - 角丸は 2px まで。影・グラデーション・絵文字は使わない
 * ================================================================ */
:root{
  --paper:#F3EFE4; --paper2:#E8E1CF; --ink:#22201C; --ink2:#5E584D; --rule:#CDC3AC; --shu:#C8372D;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDGothic","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--scene,#2b2a27);font-family:var(--font);color:var(--ink);-webkit-text-size-adjust:100%}
#wrap{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
/* HUD: 帳票の見出し帯。左=どこ / 中=いまの数値 / 右=一時停止 */
#hud{position:absolute;left:0;right:0;top:0;padding-top:var(--safe-t);background:var(--paper);border-bottom:1px solid var(--ink);display:none;grid-template-columns:1fr auto 52px;align-items:center;height:calc(48px + var(--safe-t));box-sizing:border-box;font-feature-settings:"tnum";z-index:5}
#hud.on{display:grid}
#hudL{padding-left:14px;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudL small{font-weight:500;color:var(--ink2);font-size:12px;margin-left:6px}
#hudC{padding:0 12px;font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
#hudC .warn{color:var(--shu)}
#pauseBtn{width:52px;height:48px;border:0;border-left:1px solid var(--rule);background:transparent;display:grid;place-items:center}
#pauseBtn i{display:block;width:12px;height:14px;border-left:4px solid var(--ink);border-right:4px solid var(--ink);box-sizing:border-box}
/* シート: 下から出る帳票。親指で押せる位置にボタンを置く */
#sheetBg{position:absolute;inset:0;background:rgba(34,32,28,.5);display:none;z-index:10}
#sheetBg.on{display:block}
#sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,460px);max-height:calc(100% - 24px - var(--safe-t));overflow:auto;box-sizing:border-box;background:var(--paper);border-top:3px solid var(--ink);padding:22px 20px calc(18px + var(--safe-b));animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#sheet .no{font-size:11.5px;letter-spacing:.14em;color:var(--ink2);margin:0 0 6px}
#sheet h1{font-size:26px;line-height:1.3;margin:0 0 4px;letter-spacing:.02em;padding-right:96px}
#sheet .lead{font-size:15px;line-height:1.75;margin:14px 0 14px;white-space:pre-line}
#sheet dl{margin:0 0 18px;border-top:1px solid var(--ink)}
#sheet dl div{display:grid;grid-template-columns:7.5em 1fr;border-bottom:1px solid var(--rule);padding:9px 0;font-size:14px;line-height:1.6}
#sheet dt{color:var(--ink2)}
#sheet dd{margin:0;font-weight:600;font-feature-settings:"tnum"}
#sheet .acts{display:grid;gap:8px}
.btn{height:54px;border:0;border-radius:2px;background:var(--ink);color:var(--paper);font-size:16px;font-weight:700;letter-spacing:.06em}
.btn:focus-visible,.sub button:focus-visible,#pauseBtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn:active{transform:translateY(1px);opacity:.9}
.sub{display:flex;flex-wrap:wrap;justify-content:center;gap:0 4px}
.sub button{min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--ink);font-size:14px;text-decoration:underline;text-underline-offset:3px}
/* 判子: 結果シートの右上に押される。中身は最大4字 */
.stamp{position:absolute;top:12px;right:16px;width:76px;height:76px;border:4px solid var(--shu);border-radius:6px;color:var(--shu);display:grid;place-items:center;font-weight:800;line-height:1.05;text-align:center;transform:rotate(-8deg);opacity:.92;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--shu);animation:stampIn .32s cubic-bezier(.3,1.6,.5,1) .12s both}
.stamp.round{border-radius:50%}
.stamp span{display:block}
@keyframes stampIn{from{transform:rotate(-8deg) scale(1.9);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.92}}
@media (prefers-reduced-motion:reduce){#sheet,.stamp{animation:none}}
/* ===== GAME HACK 共通UI（ここまで）===== */
/* ===== ゲーム固有の見た目: 地方気象台の「お知らせ」（発表文）と天気図の凡例 ===== */
:root{--scene:#E9EEEC;--paper:#FBFBF7;--paper2:#EEF2F1;--ink:#1B2A44;--ink2:#4E5966;--rule:#C3CBCF}
/* HUD: 天気図の凡例の枠（二重罫）。数値は等幅数字 */
#hud{border-bottom:3px double var(--ink)}
#hudL{letter-spacing:.04em}
#hudL small{font-weight:600;color:var(--ink2);border:1px solid var(--rule);padding:1px 4px;margin-left:6px;font-size:11.5px}
#hudC{font-size:14px;padding:0 10px}
#pauseBtn{border-left:1px solid var(--ink)}
@media (max-width:374px){#hudL{font-size:14px;padding-left:10px}#hudL small{font-size:11px;margin-left:4px}#hudC{font-size:13px;padding:0 8px}}
/* シート: 発表文の書式。見出し・本文・参考事項の表 */
#sheet{border-top:3px double var(--ink)}
#sheet .no{letter-spacing:.08em;padding-bottom:7px;border-bottom:1px solid var(--rule);margin-bottom:12px}
#sheet h1{font-size:22px;line-height:1.45;letter-spacing:.01em;word-break:auto-phrase;text-wrap:pretty}
#sheet > .no:first-child + h1{padding-right:0}
#sheet .lead{font-size:14.5px;text-indent:1em}
#sheet dl{border:1px solid var(--ink)}
#sheet dl div{padding:0;grid-template-columns:8em 1fr}
#sheet dl div:last-child{border-bottom:0}
#sheet dt{background:var(--paper2);padding:8px 10px;border-right:1px solid var(--rule);font-size:13px}
#sheet dd{padding:8px 10px}
/* 結果の発表文だけ、地方気象台のお知らせと同じ（見出し）（本文）（参考事項）を付ける */
#sheet .stamp ~ h1::before,#sheet .stamp ~ .lead::before,#sheet .stamp ~ dl::before{display:block;font-size:12px;font-weight:500;color:var(--ink2);letter-spacing:.06em;text-indent:0;line-height:1.6}
#sheet .stamp ~ h1::before{content:"（見出し）"}
#sheet .stamp ~ .lead::before{content:"（本文）"}
#sheet .stamp ~ dl{position:relative;margin-top:30px}
#sheet .stamp ~ dl::before{content:"（参考事項）";position:absolute;left:0;top:-23px}

</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <!-- 共通UI: ここから -->
  <div id="hud"><div id="hudL"></div><div id="hudC"></div><button id="pauseBtn" aria-label="一時停止"><i></i></button></div>
  <div id="sheetBg"><div id="sheet" role="dialog" aria-modal="true"></div></div>
  <!-- 共通UI: ここまで -->
</div>
<script>
'use strict';
/* ============================================================
 * 梅雨前線ディフェンス
 * 型: 題材(梅雨入り) × 物理化(高気圧=前線をせき止める円盤・停滞=雨量が積もる) × 権限(太平洋高気圧を指で動かせる) × 技術(地方の上でなく海の上で前線を止める位置取り) × 見せ場(「梅雨入りしたと見られます」テロップ)
 * 梅雨入りの平年日は気象庁「過去の梅雨入りと梅雨明け」（1991〜2020年の平均）。前線の形・雨量は概略
 * ============================================================ */

// ================================================================
// GAME HACK 共通UI（ここから）— 書き換えずにコピーする
// ================================================================
// 論理座標: 横幅 W=420 固定。高さ H は端末の縦横比に合わせて 700〜920 で伸びる（上下の黒帯を出さない）
// 描画は H を見てレイアウトする（上端=HUD 下、下端=親指ゾーン）
const W=420; let H=760;
const HUD_H=48;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let DPR=1,SC=1,TX=0,TY=0,VW=0,VH=0,SAFE_T=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  H=Math.max(700,Math.min(920,Math.round(W*VH/VW)));
  SC=Math.min(VW/W,VH/H); TX=(VW-W*SC)/2; TY=(VH-H*SC)/2;
  SAFE_T=(parseFloat(getComputedStyle($('hud')).paddingTop)||0)/SC;
  if(typeof onResize==='function')onResize();
}
// 画面座標 → 論理座標
function toGame(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left-TX)/SC, y:(e.clientY-r.top-TY)/SC}; }
// DOM 要素の中心 → 論理座標（下部ボタンとの距離判定などに使う）
function elCenter(el){ const r=el.getBoundingClientRect(); return toGame({clientX:r.left+r.width/2,clientY:r.top+r.height/2}); }
// HUD の下端（論理座標）。ゲームの描画はここから下に置く
function topY(){ return HUD_H+SAFE_T; }
// 振動（対応端末のみ）
function buzz(ms){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(_){} }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const UI={
  hud(l,lSmall,c){ $('hud').classList.add('on'); $('hudL').innerHTML=esc(l)+(lSmall?'<small>'+esc(lSmall)+'</small>':''); $('hudC').innerHTML=c||''; },
  hideHud(){ $('hud').classList.remove('on'); },
  /* シートを開く
   * o = { no:'No.01 · 乗務報告', title, lead, rows:[[ラベル,値],...], stamp:'不可'|'発車'(最大4字), round:true(丸印),
   *       main:[ラベル,fn], subs:[[ラベル,fn],...] } */
  sheet(o){
    const s=$('sheet');
    let h='';
    if(o.stamp){ const t=[...o.stamp]; const lines=t.length===4?[t.slice(0,2).join(''),t.slice(2).join('')]:t.length===3?[t.join('')]:[t.join('')];
      const fs=t.length<=2?27:t.length===3?20:22;
      h+='<div class="stamp'+(o.round?' round':'')+'" style="font-size:'+fs+'px">'+lines.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>'; }
    if(o.no)h+='<p class="no">'+esc(o.no)+'</p>';
    h+='<h1>'+esc(o.title)+'</h1>';
    if(o.lead)h+='<p class="lead">'+esc(o.lead)+'</p>';
    if(o.rows&&o.rows.length)h+='<dl>'+o.rows.map(r=>'<div><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>').join('')+'</dl>';
    h+='<div class="acts">';
    if(o.main)h+='<button class="btn" data-k="main">'+esc(o.main[0])+'</button>';
    // 𝕏 の共有ボタンがあれば、その隣に Facebook の共有を足す
    if(o.subs){ const i=o.subs.findIndex(b=>/𝕏/.test(b[0])); if(i>=0&&!o.subs.some(b=>/Facebook/.test(b[0]))) o.subs=[...o.subs.slice(0,i+1),['Facebookで共有',shareFB],...o.subs.slice(i+1)]; }
    if(o.subs&&o.subs.length)h+='<div class="sub">'+o.subs.map((b,i)=>'<button data-k="s'+i+'">'+esc(b[0])+'</button>').join('')+'</div>';
    h+='</div>';
    s.innerHTML=h; s.scrollTop=0;
    s.querySelectorAll('button').forEach(b=>{
      const k=b.dataset.k, fn=k==='main'?o.main[1]:o.subs[+k.slice(1)][1];
      b.addEventListener('click',e=>{ e.stopPropagation(); fn(); });
    });
    $('sheetBg').classList.add('on');
    const m=s.querySelector('.btn'); if(m)setTimeout(()=>m.focus({preventScroll:true}),50);
  },
  close(){ $('sheetBg').classList.remove('on'); },
  open(){ return $('sheetBg').classList.contains('on'); },
};
// 共有（𝕏）とポータルへ
function shareX(text,tag){ window.open('https://x.com/intent/post?text='+encodeURIComponent(text+'\n\n#'+tag+' #GAMEHACK\n'+location.href.split('#')[0]),'_blank','noopener'); }
function shareFB(){ window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href.split('#')[0]),'_blank','noopener'); }
function toPortal(){ location.href='../../'; }
// 一時停止: HUD 右の ‖ / タブ切替で自動停止 / Esc
let pausedFrom=null;
function pause(){
  if(G.screen!=='play')return;
  pausedFrom='play'; G.screen='pause';
  UI.sheet({no:GAME_NO+' · 一時停止中',title:'一時停止',main:['再開する',resume],subs:[['この面をやり直す',()=>{UI.close();restart();}],['一覧へ戻る',toPortal]]});
}
function resume(){ if(G.screen!=='pause')return; UI.close(); G.screen='play'; lastTs=0; }
$('pauseBtn').addEventListener('click',e=>{ e.stopPropagation(); G.screen==='pause'?resume():pause(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden)pause(); });
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ G.screen==='pause'?resume():pause(); } });
// ===== GAME HACK 共通UI（ここまで）=====

// ==CORE== 天気図の物理（DOM 非依存。scratchpad の solver.js がこの区間だけ切り出して検証する）
// 投影: 正距円筒に近い簡略投影。経度 123°E が x=0、北緯 46.5° が y=0（地図座標。画面では topY() を足す）
const LON0=123, LAT0=46.5, KX=17.5, KY=17.5/Math.cos(36*Math.PI/180);
const lx=lon=>(lon-LON0)*KX, ly=lat=>(LAT0-lat)*KY;
const xlon=x=>x/KX+LON0, ylat=y=>LAT0-y/KY;
// 日付: 5月1日=0
const md=(m,d)=>m===4?d-31:m===5?d-1:m===6?30+d:60+d;
function dstr(day){ const d=Math.floor(day+1e-6); return d<0?'4月'+(31+d)+'日':d<31?'5月'+(d+1)+'日':d<61?'6月'+(d-30)+'日':'7月'+(d-60)+'日'; }

// 気象庁「過去の梅雨入りと梅雨明け」平年値（1991〜2020年の平均）。city は判定に使う代表地点（概略）
// pts は大雨の集計で陸地をどの地方に振り分けるかの代表点（概略）
const REG=[
  {id:'okinawa', name:'沖縄',    city:'那覇',   lon:127.68,lat:26.21,on:[5,10],last:[5,4],  pts:[[127.8,26.4]]},
  {id:'amami',   name:'奄美',    city:'名瀬',   lon:129.49,lat:28.38,on:[5,12],last:[5,3],  pts:[[129.4,28.3]]},
  {id:'kyushuS', name:'九州南部',city:'鹿児島', lon:130.55,lat:31.56,on:[5,30],last:[5,20], pts:[[130.5,31.5],[131.3,32.0],[130.9,31.2]]},
  {id:'kyushuN', name:'九州北部',city:'福岡',   lon:130.40,lat:33.58,on:[6,4], last:[6,2],  pts:[[130.4,33.5],[129.9,32.9],[130.8,32.7],[131.4,33.2],[131.6,34.2]]},
  {id:'shikoku', name:'四国',    city:'高松',   lon:134.05,lat:34.34,on:[6,5], last:[6,2],  pts:[[132.8,33.5],[133.6,33.7],[134.3,33.9]]},
  {id:'chugoku', name:'中国',    city:'広島',   lon:132.46,lat:34.40,on:[6,6], last:[6,2],  pts:[[132.6,34.6],[133.8,34.8],[133.2,35.3],[134.3,35.3]]},
  {id:'kinki',   name:'近畿',    city:'大阪',   lon:135.52,lat:34.69,on:[6,6], last:[6,2],  pts:[[135.5,34.7],[135.8,34.0],[135.2,35.3],[136.0,35.1]]},
  {id:'tokai',   name:'東海',    city:'名古屋', lon:136.97,lat:35.17,on:[6,6], last:[6,2],  pts:[[136.9,35.2],[138.3,35.0],[137.2,35.8],[136.4,34.5]]},
  {id:'kanto',   name:'関東甲信',city:'東京',   lon:139.75,lat:35.69,on:[6,7], last:[6,2],  pts:[[139.7,35.7],[140.2,35.4],[138.5,35.7],[138.2,36.3],[139.6,36.5]]},
  {id:'hokuriku',name:'北陸',    city:'新潟',   lon:139.05,lat:37.91,on:[6,11],last:[6,20], pts:[[139.0,37.7],[137.2,36.7],[136.4,36.1],[138.6,37.3]]},
  {id:'tohokuS', name:'東北南部',city:'仙台',   lon:140.87,lat:38.26,on:[6,12],last:[6,20], pts:[[140.9,38.3],[140.3,38.3],[140.4,37.4],[140.0,38.9]]},
  {id:'tohokuN', name:'東北北部',city:'盛岡',   lon:141.15,lat:39.70,on:[6,15],last:[6,21], pts:[[141.2,39.7],[140.7,40.7],[140.2,39.7],[141.6,40.4]]},
];
// 気象庁の発表で使う地方名（「九州南部」「東北南部」「東北北部」は「地方」を付けない）
const JNAME={okinawa:'沖縄地方',amami:'奄美地方',kyushuS:'九州南部',kyushuN:'九州北部地方',shikoku:'四国地方',chugoku:'中国地方',kinki:'近畿地方',tokai:'東海地方',kanto:'関東甲信地方',hokuriku:'北陸地方',tohokuS:'東北南部',tohokuN:'東北北部'};
const REGI={}; REG.forEach((r,i)=>{ r.i=i; r.jname=JNAME[r.id]; r.onDay=md(r.on[0],r.on[1]); REGI[r.id]=r; });

// 前線の自然な北上: 各地方の代表地点に平年の梅雨入り日ちょうどに達するよう、日付→基準緯度を折れ線で結ぶ
const M_PX=5;         // 前線が代表地点の何px南まで来たら梅雨入りとするか
const TILT=0.1;                                     // 前線は西南西→東北東にわずかに傾く
const WIG=lon=>0.25*Math.sin((lon-120)/3.1);        // 天気図らしい緩いうねり（固定）
const ANCH=(()=>{
  const m=new Map();
  REG.forEach(r=>{ const b=r.lat-M_PX/KY-TILT*(r.lon-135)-WIG(r.lon); m.set(r.onDay,Math.max(m.get(r.onDay)??-99,b)); });
  const a=[...m.entries()].sort((p,q)=>p[0]-q[0]);
  for(let i=1;i<a.length;i++) a[i][1]=Math.max(a[i][1],a[i-1][1]+0.05);
  a.unshift([a[0][0]-21,a[0][1]-2.8]);                 // 4月中旬: 前線は沖縄の南（概略）
  const L=a[a.length-1]; a.push([L[0]+30,L[1]+0.28*30]); // 平年の東北北部梅雨入り以降も 0.28°/日 で北上（概略）
  return a;
})();
function baseLat(day){
  const a=ANCH; if(day<=a[0][0])return a[0][1];
  for(let i=1;i<a.length;i++) if(day<=a[i][0]){ const t=(day-a[i-1][0])/(a[i][0]-a[i-1][0]); return a[i-1][1]+t*(a[i][1]-a[i-1][1]); }
  return a[a.length-1][1];
}
const natLat=(lon,day)=>baseLat(day)+TILT*(lon-135)+WIG(lon);

const STAGES=[
  {r:'okinawa', K:7, person:0},
  {r:'kyushuS', K:8, person:1},

const R_DISK=118;     // 高気圧の半径（px）
const V_FRONT=70;     // 前線が自然位置へ戻る速さ（px/日）
const MOVE_CAP=700;   // 高気圧の移動上限（px/日）
const BULGE=0.2;      // せき止めた分だけ両脇の前線が北へ張り出す割合
const RAIN=45;        // 停滞前線 1 点あたりの雨量（mm/日）
const RAIN_R=0.9;     // 地方の代表点からこの距離（度）までの前線が雨を降らせる
const TAU=2;          // 雨量の減衰（日）
const DLIM=120;        // 前線を押し込める深さの限界（px）
const GMAX=300;       // この雨量で「大雨」
const COLS=[]; for(let x=-42;x<=462;x+=7) COLS.push(x);

// 陸地判定（日本のみ。北海道は梅雨の地方区分外なので除外）
let JP=[];
function setCoast(jp){
  JP=jp.map(f=>{ const xs=[],ys=[]; for(let i=0;i<f.length;i+=2){ xs.push(f[i]); ys.push(f[i+1]); }
    return {xs,ys,x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)}; });
}
function onLand(lon,lat){
  for(const p of JP){
    if(p.y1>44.5) continue;
    if(lon<p.x0||lon>p.x1||lat<p.y0||lat>p.y1) continue;
    let c=false; const n=p.xs.length;
    for(let i=0,j=n-1;i<n;j=i++){ if((p.ys[i]>lat)!==(p.ys[j]>lat) && lon<(p.xs[j]-p.xs[i])*(lat-p.ys[i])/(p.ys[j]-p.ys[i])+p.xs[i]) c=!c; }
    if(c) return true;
  }
  return false;
}
function nearestReg(lon,lat){
  let best=null,bd=1e9; const k=Math.cos(36*Math.PI/180);
  for(const r of REG) for(const p of r.pts){ const d=((lon-p[0])*k)**2+(lat-p[1])**2; if(d<bd){bd=d;best=r;} }
  return bd<1.6? best:null;
}

function simInit(si){
  const st=STAGES[si], r=REGI[st.r];
  const S={si,day:st.start,end:st.end,target:r.id,hx:lx(r.lon)+100,hy:ly(r.lat)-70,a:[],N:[],d:[],b:[],held:[],g:{},onset:{},dmax:0,fail:null,clear:false,peak:{},rainCells:[]};
  REG.forEach(q=>{ S.g[q.id]=0; S.peak[q.id]=0; if(natLat(q.lon,S.day)>=q.lat-M_PX/KY) S.onset[q.id]=q.onDay; });
  COLS.forEach((x,i)=>{ S.a[i]=ly(natLat(xlon(x),S.day)); S.N[i]=S.a[i]; S.d[i]=0; S.b[i]=0; S.held[i]=false; });
  constrain(S);
  return S;
}
function constrain(S){
  // 前線は1本の線: どこか1点でも高気圧の南側でせき止められていれば、圏内に入った点はすべて南の縁へ
  const south=S.held.some(h=>h);
  COLS.forEach((x,i)=>{
    const dx=x-S.hx; S.held[i]=false;
    if(Math.abs(dx)<R_DISK){ const s=Math.sqrt(R_DISK*R_DISK-dx*dx), top=S.hy-s, bot=S.hy+s;
      if(S.a[i]>top-0.01&&S.a[i]<bot+0.01){ S.a[i]=(south||S.a[i]>=S.hy)?bot:top; S.held[i]=S.a[i]===bot; } }
  });
}
function frontYAt(S,x){ const f=(x-COLS[0])/7, i=Math.max(0,Math.min(COLS.length-2,Math.floor(f))), t=f-i; return S.a[i]*(1-t)+S.a[i+1]*t; }

// dt: 日。tx,ty: 指が示す高気圧の目標位置（地図座標）
function simStep(S,dt,tx,ty){
  if(S.fail||S.clear) return;
  S.day+=dt;
  // 高気圧の移動（上限つき）
  let mx=tx-S.hx,my=ty-S.hy; const L=Math.hypot(mx,my), cap=MOVE_CAP*dt;
  if(L>cap){ mx*=cap/L; my*=cap/L; }
  S.hx=Math.max(-70,Math.min(490,S.hx+mx)); S.hy=Math.max(ly(49),Math.min(ly(14),S.hy+my));
  // 前線の自然位置へ寄る（せき止めた分は両脇が北へ張り出す）
  COLS.forEach((x,i)=>{
    const N=ly(natLat(xlon(x),S.day)); S.N[i]=N;
    const e=Math.max(0,Math.abs(x-S.hx)-R_DISK);
    S.b[i]=BULGE*S.dmax*Math.exp(-((e/60)**2)); const T=N-S.b[i];
    const df=T-S.a[i], v=V_FRONT*dt; S.a[i]+=Math.max(-v,Math.min(v,df));
  });
  constrain(S);
  // 押しすぎ: 自然位置より DLIM 以上南へ押し込んだ点は、高気圧の北側へ乗り越える
  // （せき止めていた部分がまとめて北側の縁へ移る）
  const oi=COLS.findIndex((x,i)=>S.held[i]&&S.a[i]-S.N[i]>DLIM);
  if(oi>=0){ S.overDay=S.day; S.overX=COLS[oi];
    COLS.forEach((x,i)=>{ if(!S.held[i])return; const dx=x-S.hx; S.a[i]=S.hy-Math.sqrt(Math.max(0,R_DISK*R_DISK-dx*dx)); S.held[i]=false; }); }
  // 停滞した前線（高気圧にせき止められている部分）が上にある地方に雨が積もる
  let dmax=0; const decay=Math.exp(-dt/TAU); for(const k in S.g) S.g[k]*=decay;
  S.rainCells.length=0; const ck=Math.cos(36*Math.PI/180);
  COLS.forEach((x,i)=>{
    const d=S.held[i]?S.a[i]-S.N[i]:0; S.d[i]=d; if(d>dmax)dmax=d;
    if(d<3) return;
    const w=Math.min(1,d/25), lon=xlon(x), la=ylat(S.a[i]); let tot=0;
    for(const r of REG){ if(r.id===S.target) continue;
      let k=0; for(const p of r.pts){ const q=1-Math.hypot((lon-p[0])*ck,la-p[1])/RAIN_R; if(q>k)k=q; }
      if(k>0){ S.g[r.id]+=RAIN*w*k*dt; tot+=k; } }
    S.rainCells.push([x,S.a[i],w*Math.min(1,tot)]);
  });
  S.dmax=dmax;
  for(const k in S.g){ if(S.g[k]>S.peak[k])S.peak[k]=S.g[k];
    if(S.g[k]>=GMAX){ S.fail={type:'rain',reg:k,day:S.day}; return; } }
  // 梅雨入り判定（前線が代表地点のすぐ南まで来たら）
  for(const r of REG){ if(S.onset[r.id]!=null) continue;
    if(frontYAt(S,lx(r.lon))<=ly(r.lat)+M_PX){ S.onset[r.id]=S.day; if(r.id===S.target){ S.fail={type:'onset',reg:r.id,day:S.day}; return; } } }
  if(S.day>=S.end) S.clear=true;
}

// ---- ゲーム固有 ----------------------------------------------
const GAME_NO='No.05';
const TAG='梅雨前線ディフェンス';
const DAY_SEC=1.5;                 // 1日 = 1.5秒
setCoast(COAST.jp);

const G={screen:'title',stage:0,S:null,tx:0,ty:0,anim:null,guide:0,pops:[],wet:0,records:[],t:0};
let lastTs=0;

// 洗濯物を干している場所（面ごと）
const PLACES=['那覇市のベランダ','鹿児島市の物干し台','大阪市のベランダ','東京都内のベランダ','新潟市の物干し台','盛岡市の庭'];

function startStage(i){
  G.stage=i; G.S=simInit(i); G.tx=G.S.hx; G.ty=G.S.hy; G.anim=null; G.guide=3.4; G.pops=[]; G.wet=0;
  G.screen='play'; UI.close(); lastTs=0;
}
function restart(){ startStage(G.stage); }

function update(dt){
  G.t+=dt;
  if(G.anim){ G.anim.t+=dt; if(G.anim.kind==='fail')G.wet=Math.min(1,G.wet+dt*1.2); if(G.anim.t>=G.anim.dur){ const a=G.anim; G.anim=null; a.done(); } return; }
  G.guide=Math.max(0,G.guide-dt);
  const S=G.S, before=Object.assign({},S.onset);
  let rem=dt/DAY_SEC;
  while(rem>1e-9&&!S.fail&&!S.clear){ const h=Math.min(rem,1/120); simStep(S,h,G.tx,G.ty); rem-=h; }
  for(const r of REG) if(before[r.id]==null&&S.onset[r.id]!=null&&r.id!==S.target) G.pops.push({r,t:0,k:G.pops.filter(p=>p.t<0.4).length});
  G.pops.forEach(p=>p.t+=dt); G.pops=G.pops.filter(p=>p.t<2.6);
  if(S.fail){ buzz([30,40,80]); G.anim={kind:'fail',t:0,dur:1.2,done:fail}; }
  else if(S.clear){ G.anim={kind:'clear',t:0,dur:0.9,done:clear}; }
}

// ---- 結果 ----
const delayStr=d=>d>0?'平年より'+d+'日遅く':d<0?'平年より'+(-d)+'日早く':'平年並み';
function maxRain(S){ let k=null,v=0; for(const id in S.peak) if(S.peak[id]>v){v=S.peak[id];k=id;} return {r:k&&REGI[k],v:Math.round(v)}; }
function fail(){
  const S=G.S, st=STAGES[G.stage], r=REGI[S.target], f=S.fail;
  G.screen='result';
  if(f.type==='onset'){
    const day=Math.floor(f.day), dl=day-r.onDay;
    const over=S.overDay!=null&&f.day-S.overDay<0.6;
    const cause=over?'前線を南へ押し込みすぎて、高気圧の北側へ乗り越えられました'
      :'高気圧の南の縁が'+r.city+'より北にあり、前線が'+r.city+'まで届きました';
    UI.sheet({no:GAME_NO+' · 梅雨の時期に関する気象情報',title:r.jname+'は梅雨入りしたと見られます',stamp:'梅雨入',
      lead:r.jname+'は、前線や低気圧の影響で曇りや雨となっています。向こう一週間も、前線や低気圧の影響で曇りや雨の日が多い見込みです。\nこのため、'+r.jname+'は、'+dstr(day)+'ごろに梅雨入りしたと見られます。',
      rows:[['梅雨入り',dstr(day)+'ごろ（'+delayStr(dl)+'）'],['平年',dstr(r.onDay)+'ごろ'],['目標',dstr(S.end)+'まで晴れ'],['原因',cause],['洗濯物',PLACES[G.stage]+'で全部ぬれました']],
      main:['この面をやり直す',restart],
      subs:[['𝕏で共有',()=>shareX('【'+TAG+'】'+r.jname+'は'+dstr(day)+'ごろに梅雨入りしたと見られます（'+delayStr(dl)+'）。目標の'+dstr(S.end)+'まで守れませんでした',TAG)],['一覧へ',toPortal]]});
  }else{
    const q=REGI[f.reg], day=Math.floor(f.day);
    UI.sheet({no:GAME_NO+' · 気象情報',title:'前線が停滞し、'+q.jname+'で大雨',stamp:'大雨',
      lead:'梅雨前線が'+q.jname+'付近に停滞し、'+q.jname+'では'+dstr(day)+'にかけて大雨となっています。',
      rows:[['雨量',q.jname+' '+GMAX+'mm'],['日付',dstr(day)],['原因','高気圧で前線を'+q.jname+'の上にせき止め続けました'],['守っていた地方',r.jname+'（'+dstr(S.end)+'まで）']],
      main:['この面をやり直す',restart],
      subs:[['𝕏で共有',()=>shareX('【'+TAG+'】'+r.jname+'の梅雨入りを遅らせようとして、'+q.jname+'に大雨（'+GMAX+'mm）を降らせました',TAG)],['一覧へ',toPortal]]});
  }
}
function clear(){
  const S=G.S, st=STAGES[G.stage], r=REGI[S.target], mr=maxRain(S);
  G.screen='result'; G.records[G.stage]={K:st.K,rain:mr};
  const last=G.stage>=STAGES.length-1;
  const early=REG.filter(q=>q.id!==S.target&&S.onset[q.id]!=null&&S.onset[q.id]<q.onDay-1).map(q=>q.jname);
  const rows=[['晴れ',dstr(S.end)+'まで（'+delayStr(st.K)+'）'],['平年',dstr(r.onDay)+'ごろ'],['最大雨量',mr.r?mr.r.jname+' '+mr.v+'mm':'なし']];
  if(early.length) rows.push(['先に梅雨入り',early.join('・')+'（平年より早く）']);
  if(last){
    UI.sheet({no:GAME_NO+' · 梅雨の時期に関する気象情報',title:'東北北部まで、梅雨入りを遅らせました',stamp:'晴天',round:true,
      lead:'沖縄から東北北部まで、6つの地方で洗濯物を守りきりました。',
      rows:STAGES.map((s,i)=>[REGI[s.r].jname,dstr(s.end)+'まで晴れ（+'+s.K+'日）']),
      main:['はじめから',()=>startStage(0)],
      subs:[['𝕏で共有',()=>shareX('【'+TAG+'】太平洋高気圧になって、沖縄から東北北部まで梅雨入りを平年より6〜11日遅らせました',TAG)],['一覧へ',toPortal]]});
  }else{
    UI.sheet({no:GAME_NO+' · 梅雨の時期に関する気象情報',title:r.jname+'は'+dstr(S.end).replace('月','月\u2060')+'まで晴れ',stamp:'晴天',round:true,
      lead:PLACES[G.stage]+'の洗濯物は、'+dstr(S.end)+'まで乾いたままです。',
      rows,
      main:['次の面へ',()=>startStage(G.stage+1)],
      subs:[['𝕏で共有',()=>shareX('【'+TAG+'】'+r.jname+'の梅雨入りを'+delayStr(st.K)+'しました（'+dstr(S.end)+'まで晴れ）',TAG)],['一覧へ',toPortal]]});
  }
}
function showTitle(){
  G.screen='title'; UI.hideHud(); G.S=simInit(2); G.S.hx=lx(141); G.S.hy=ly(26); G.S.a=G.S.N.slice(); G.anim=null;
  UI.sheet({no:GAME_NO+' · 業務内容',title:'梅雨前線ディフェンス',
    lead:'あなたは太平洋高気圧。南から北上してくる梅雨前線をせき止めて、洗濯物を干している地方の梅雨入りを平年より遅らせる。',
    rows:[['あなたの権限','太平洋高気圧を指で好きな場所へ動かせる'],['操作','画面のどこでもドラッグすると、高気圧が同じだけ動く'],
      ['失敗','守る地方が梅雨入りする／せき止めた前線の下の地方の雨量が'+GMAX+'mmに達する'],
      ['出典','梅雨入りの平年日: 気象庁「過去の梅雨入りと梅雨明け」（1991〜2020年の平均）data.jma.go.jp/cpd/baiu/　発表文: 地方気象台「梅雨入りに関するお知らせ」　前線の位置・雨量は平年日に合わせた概略値']],
    main:['はじめる',()=>startStage(0)],subs:[['面を選ぶ',showStages],['一覧へ',toPortal]]});
}
function showStages(){
  UI.sheet({no:GAME_NO+' · 面を選ぶ',title:'どの地方を守るか',
    rows:STAGES.map((s,i)=>[(i+1)+'. '+REGI[s.r].name,dstr(s.end)+'まで晴れ'+[...'（平年'+dstr(REGI[s.r].onDay)+'ごろ）'].join('\u2060')]),
    main:['1. 沖縄から',()=>startStage(0)],
    subs:STAGES.slice(1).map((s,i)=>[(i+2)+'',()=>startStage(i+1)]).concat([['戻る',showTitle]])});
}

// ---- 入力: どこを触っても高気圧が指と同じだけ動く ----
let drag=null;
const clampT=()=>{ G.tx=Math.max(-70,Math.min(490,G.tx)); G.ty=Math.max(ly(49),Math.min(ly(14),G.ty)); };
$('wrap').addEventListener('pointerdown',e=>{
  if(G.screen!=='play'||G.anim||e.target.closest('#hud'))return;
  const p=toGame(e); drag={id:e.pointerId,x:p.x,y:p.y,tx:G.tx,ty:G.ty}; G.guide=Math.min(G.guide,0.6);
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id||G.screen!=='play')return;
  const p=toGame(e); G.tx=drag.tx+(p.x-drag.x); G.ty=drag.ty+(p.y-drag.y); clampT();
});
['pointerup','pointercancel'].forEach(k=>window.addEventListener(k,e=>{ if(drag&&e.pointerId===drag.id)drag=null; }));
window.addEventListener('keydown',e=>{
  if(G.screen!=='play')return; const k={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,-8],ArrowDown:[0,8]}[e.key];
  if(k){ G.tx+=k[0]; G.ty+=k[1]; clampT(); e.preventDefault(); }
});

function buildPaths(){
  const mk=list=>{ const p=new Path2D(); list.forEach(f=>{ for(let i=0;i<f.length;i+=2){ const x=lx(f[i]),y=ly(f[i+1]); i?p.lineTo(x,y):p.moveTo(x,y); } p.closePath(); }); return p; };
  LAND_JP=mk(COAST.jp); LAND_OT=mk(COAST.other);
}
buildPaths();

// ---- 天気図の文字の配置: 毎フレーム、優先度の高い順に置き、重なる・はみ出す位置には置かない ----
// LB: 置いた矩形（画面の論理座標）。LQ: 最後にまとめて描く文字。LMISS: 置けなかった必須ラベル（検証用）
let LB=[],LQ=[],LMISS=[];
function lbHit(r){ return LB.some(q=>r[0]<q[2]&&r[2]>q[0]&&r[1]<q[3]&&r[3]>q[1]); }
function lbIn(r){ return r[0]>=1&&r[2]<=W-1&&r[1]>=topY()+1&&r[3]<=H-1; }
function lbBlock(x0,y0,x1,y1,kind){ LB.push([x0,y0,x1,y1,kind||'block']); }
// o={text,font,h,pad,bg,fg,kind,req}; cands=[[cx,cy],...] 中心の候補を順に試す。文字は measureText で実測
function label(o,cands){
  ctx.font=o.font; const w=ctx.measureText(o.text).width+2*(o.pad??3), h=o.h;
  for(const [cx,cy] of cands){ const r=[cx-w/2,cy-h/2,cx+w/2,cy+h/2];
    if(lbIn(r)&&!lbHit(r)){ LB.push([...r,o.kind||'label',o.text]); LQ.push({...o,r}); return r; } }
  if(o.req) LMISS.push(o.text);
  return null;
}
function drawQueued(){
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const q of LQ){ const [x0,y0,x1,y1]=q.r; ctx.globalAlpha=q.alpha??1;
    if(q.bg){ ctx.fillStyle=q.bg; ctx.fillRect(x0,y0,x1-x0,y1-y0); }
    if(q.box){ ctx.strokeStyle=q.box; ctx.lineWidth=1; ctx.strokeRect(x0+0.5,y0+0.5,x1-x0-1,y1-y0-1); }
    ctx.font=q.font; ctx.fillStyle=q.fg; ctx.fillText(q.text,(x0+x1)/2,(y0+y1)/2+0.5); }
  ctx.restore();
}

// 気圧: 前線に沿った気圧の谷 + 低気圧 + オホーツク海高気圧（背景の等圧線用）
function lowPos(S){ const st=STAGES[S.si]; const x=((S.day-st.start)*34+40)%560-60; return {x,y:frontYAt(S,x)}; }
function pBg(S,x,y,fy,lo){
  let p=1005+0.07*Math.abs(y-fy);
  p-=7*Math.exp(-((x-lo.x)**2+(y-lo.y)**2)/(55*55));
  p+=9*Math.exp(-((x-470)**2+(y+40)**2)/(150*150));
  return p;
}
function drawIsobars(S,top){
  const step=14, nx=Math.ceil(W/step)+2, ny=Math.ceil((H-top)/step)+2, lo=lowPos(S);
  const nat=x=>{ const f=(x-COLS[0])/7, i=Math.max(0,Math.min(COLS.length-2,Math.floor(f))), t=f-i; return S.N[i]*(1-t)+S.N[i+1]*t; };
  const val=[]; for(let i=0;i<nx;i++){ const x=i*step-step, fy=nat(x); val[i]=[]; for(let j=0;j<ny;j++) val[i][j]=pBg(S,x,j*step-step,fy,lo); }
  ctx.save(); ctx.translate(0,top);
  // 高気圧の圏内は高気圧の等圧線だけを描く
  ctx.beginPath(); ctx.rect(-20,-20,W+40,H+40); ctx.arc(S.hx,S.hy,R_DISK+5,0,Math.PI*2,true); ctx.clip();
  ctx.strokeStyle=C.iso; ctx.lineWidth=1;
  const labels=[];
  for(const lv of [1004,1008,1012,1016]){
    ctx.beginPath(); ctx.lineWidth=lv===1000||lv===1020?2:1;
    for(let i=0;i<nx-1;i++) for(let j=0;j<ny-1;j++){
      const a=val[i][j],b=val[i+1][j],c=val[i+1][j+1],d=val[i][j+1];
      const pts=[]; const x0=i*step-step,y0=j*step-step;
      const e=(p,q,t0,t1)=>{ if((p<lv)!==(q<lv)){ const t=(lv-p)/(q-p); pts.push([t0[0]+(t1[0]-t0[0])*t,t0[1]+(t1[1]-t0[1])*t]); } };
      e(a,b,[x0,y0],[x0+step,y0]); e(b,c,[x0+step,y0],[x0+step,y0+step]); e(d,c,[x0,y0+step],[x0+step,y0+step]); e(a,d,[x0,y0],[x0,y0+step]);
      if(pts.length>=2){ ctx.moveTo(pts[0][0],pts[0][1]); ctx.lineTo(pts[1][0],pts[1][1]);
        if(pts.length===4){ ctx.moveTo(pts[2][0],pts[2][1]); ctx.lineTo(pts[3][0],pts[3][1]); }
        if(!labels[lv]&&x0>370&&x0<392&&y0>20&&y0<H-top-160) labels[lv]=[pts[0][0],pts[0][1]]; }
    }
    ctx.stroke();
  }
  ctx.restore();
  S._isoLabels=Object.keys(labels).map(lv=>[String(lv).slice(2),labels[lv][0],labels[lv][1]+top]);
  return lo;
}

// 停滞前線: 赤の半円（北側）と青の三角（南側）が交互に並ぶ
// 前線の折れ線。せき止められた部分の両端は、高気圧の縁に沿って回り込ませる
function frontPts(S){
  const out=[], R=R_DISK+1.5, onC=f=>[S.hx+R*Math.cos(f),S.hy+R*Math.sin(f)];
  for(let i=0;i<COLS.length;i++){
    if(i>0&&S.held[i-1]!==S.held[i]){
      const hi=S.held[i-1]?i-1:i, oi=S.held[i-1]?i:i-1;
      if(S.a[oi]<S.a[hi]-8){
        let f=Math.atan2(S.a[hi]-S.hy,COLS[hi]-S.hx); const west=COLS[oi]<COLS[hi], pts=[];
        for(let k=0;k<70;k++){ f+=(west?1:-1)*0.05; const q=onC(f); if(q[1]<=S.a[oi])break; pts.push(q); }
        out.push(...(S.held[i-1]?pts:pts.reverse()));
      }
    }
    out.push([COLS[i],S.a[i]]);
  }
  return out;
}
function drawFront(S,top){
  const P=frontPts(S).map(p=>[p[0],p[1]+top]);
  const seg=[]; let tot=0; for(let i=1;i<P.length;i++){ const l=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]); seg.push(l); tot+=l; }
  const at=s=>{ let i=0; while(i<seg.length-1&&s>seg[i]){ s-=seg[i]; i++; } const t=seg[i]?Math.min(1,s/seg[i]):0;
    const a=P[i],b=P[i+1]; const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1; return {x:a[0]+dx*t,y:a[1]+dy*t,tx:dx/L,ty:dy/L}; };
  const U=26; ctx.lineWidth=2.6; ctx.lineCap='butt';
  for(let s=0,k=0;s<tot;s+=U,k++){
    const red=k%2===0; ctx.strokeStyle=red?C.warm:C.cold; ctx.fillStyle=ctx.strokeStyle;
    ctx.beginPath(); for(let u=0;u<=U;u+=3){ const p=at(Math.min(tot,s+u)); u?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); } ctx.stroke();
    const m=at(Math.min(tot,s+U/2)); let nx=m.ty,ny=-m.tx; if(ny>0||(ny===0&&nx<0)){ nx=-nx; ny=-ny; } // n は北向き
    ctx.beginPath();
    if(red){ for(let k2=0;k2<=10;k2++){ const f=Math.PI*k2/10, c=Math.cos(f), sn=Math.sin(f); ctx.lineTo(m.x+5.5*(c*m.tx+sn*nx),m.y+5.5*(c*m.ty+sn*ny)); } }
    else { ctx.moveTo(m.x-6*m.tx,m.y-6*m.ty); ctx.lineTo(m.x+6*m.tx,m.y+6*m.ty); ctx.lineTo(m.x-7.5*nx,m.y-7.5*ny); }
    ctx.closePath(); ctx.fill();
  }
}

const RADAR=[[0.1,'#A0D2FF'],[0.25,'#218CFF'],[0.4,'#0041FF'],[0.55,'#FAF500'],[0.7,'#FF9900'],[0.85,'#FF2800'],[9,'#B40068']];
const radarCol=f=>RADAR.find(c=>f<c[0])[1];

function drawMap(S,top){
  ctx.fillStyle=C.sea; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(0,top);
  // 緯度経度線（5度ごと）
  ctx.strokeStyle=C.grid; ctx.lineWidth=0.8; ctx.setLineDash([3,4]); ctx.beginPath();
  for(let lon=125;lon<=145;lon+=5){ ctx.moveTo(lx(lon),-top); ctx.lineTo(lx(lon),H); }
  for(let lat=15;lat<=45;lat+=5){ ctx.moveTo(0,ly(lat)); ctx.lineTo(W,ly(lat)); }
  ctx.stroke(); ctx.setLineDash([]);
  // 陸地
  ctx.fillStyle=C.land2; ctx.fill(LAND_OT); ctx.fillStyle=C.land; ctx.fill(LAND_JP);
  ctx.strokeStyle=C.coast; ctx.lineWidth=0.9; ctx.lineJoin='round'; ctx.stroke(LAND_OT); ctx.stroke(LAND_JP);
  // 雨（レーダーの色）: 停滞した前線の下に積もった雨量
  for(const r of REG){ const g=S.g[r.id]; if(g<12) continue; const f=g/GMAX;
    ctx.globalAlpha=0.5; ctx.fillStyle=radarCol(f);
    for(const p of r.pts){ ctx.beginPath(); ctx.arc(lx(p[0]),ly(p[1]),RAIN_R*KX*0.75,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1; }
  // 前線の下で降っている雨
  ctx.fillStyle='#218CFF';
  for(const c of S.rainCells){ if(c[2]<0.05) continue; ctx.globalAlpha=0.35*c[2];
    for(let k=0;k<3;k++){ const ox=((c[0]*7+k*13+Math.floor(G.t*9))%11)-5, oy=((c[0]*3+k*7+Math.floor(G.t*11))%13)-9; ctx.fillRect(c[0]+ox,c[1]+oy,1.3,3.5); } }
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawHigh(S,top){

// ---- 洗濯物を干す人（右下の小窓） ----
function drawPerson(kind,x,y,reach){
  // x,y=足元。reach: 0..1 腕の上げ具合
  ctx.save(); ctx.translate(x,y); ctx.lineCap='round'; ctx.lineJoin='round';
  const P={
    0:{h:58,sh:12,hip:10,body:'#8E7FA0',body2:'#776989',leg:'#5A5A66',skin:'#E9C3A0',hair:'#E4E2DC',stoop:5,skirt:true},   // 高齢の女性（細身・やや前かがみ・白髪のおだんご・カーディガン）
    1:{h:66,sh:15,hip:15,body:'#F2F0EA',body2:'#D9D5CB',leg:'#2F3F5E',skin:'#D9A982',hair:'#2A2622',stoop:0,belly:true},  // 中年の男性（大柄・Tシャツ・短髪）
    2:{h:62,sh:11,hip:10,body:'#2E5E4E',body2:'#244C3F',leg:'#2E5E4E',skin:'#EFC9A8',hair:'#231F1C',stoop:0,pony:true},   // 高校生（細身・ジャージ・ポニーテール）
  }[kind];

  // 脚
  ctx.fillStyle=P.leg;
  if(P.skirt){ ctx.beginPath(); ctx.moveTo(-P.hip,hipY); ctx.lineTo(P.hip+1,hipY); ctx.lineTo(P.hip+3,-8); ctx.lineTo(-P.hip-2,-8); ctx.closePath(); ctx.fill();
    ctx.fillStyle=P.skin; ctx.fillRect(-5,-8,3,6); ctx.fillRect(3,-8,3,6); }
  else { ctx.beginPath(); ctx.moveTo(-P.hip+1,hipY); ctx.lineTo(-1,hipY); ctx.lineTo(-2,-3); ctx.lineTo(-P.hip+2,-3); ctx.closePath(); ctx.fill();
    ctx.fillStyle=P.body2==='#244C3F'?'#244C3F':shade(P.leg); ctx.beginPath(); ctx.moveTo(1,hipY); ctx.lineTo(P.hip-1,hipY); ctx.lineTo(P.hip-2,-3); ctx.lineTo(2,-3); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='#3B3530'; ctx.fillRect(-P.hip+1,-3,8,3); ctx.fillRect(1,-3,8,3);
  // 胴
  ctx.fillStyle=P.body; ctx.beginPath();
  ctx.moveTo(-P.sh+hx,shY); ctx.lineTo(P.sh+hx,shY);
  if(P.belly){ ctx.quadraticCurveTo(P.sh+8,(shY+hipY)/2+4,P.hip,hipY+2); } else ctx.lineTo(P.hip,hipY+2);
  ctx.lineTo(-P.hip,hipY+2); ctx.closePath(); ctx.fill();
  ctx.fillStyle=P.body2; ctx.beginPath(); ctx.moveTo(-P.sh+hx,shY); ctx.lineTo(-P.sh+hx+5,shY); ctx.lineTo(-P.hip+5,hipY+2); ctx.lineTo(-P.hip,hipY+2); ctx.closePath(); ctx.fill();
  if(kind===2){ ctx.strokeStyle='#E8E4D8'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-P.sh+hx+2,shY+2); ctx.lineTo(-P.hip+2,hipY); ctx.moveTo(P.sh+hx-2,shY+2); ctx.lineTo(P.hip-2,hipY); ctx.stroke(); }
  // 腕（物干しへ伸ばす）
  const ax=P.sh+hx-2, ay=shY+3, ex=ax+10+reach*4, ey=ay-6-reach*10, wx=ex+6, wy=ey-12-reach*6;
  ctx.strokeStyle=P.body; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.strokeStyle=P.skin; ctx.lineWidth=4.5; ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(wx,wy); ctx.stroke();
  ctx.strokeStyle=P.body2; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-P.sh+hx+3,ay); ctx.lineTo(ax-3,ay+8); ctx.stroke();
  // 首・頭（右を向いた横顔）
  const hy=shY-10, hdx=hx+2;
  ctx.fillStyle=P.skin; ctx.fillRect(hdx-3,shY-5,6,6);
  ctx.beginPath(); ctx.ellipse(hdx,hy,8,9,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hdx+7,hy-1); ctx.lineTo(hdx+10,hy+2); ctx.lineTo(hdx+7,hy+3); ctx.fill(); // 鼻
  ctx.fillStyle=P.hair; ctx.beginPath(); ctx.ellipse(hdx-1.5,hy-3,8.5,7,0,Math.PI,Math.PI*2.05); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hdx-9,hy-3); ctx.lineTo(hdx-2,hy-3); ctx.lineTo(hdx-3,hy+5); ctx.lineTo(hdx-8,hy+3); ctx.closePath(); ctx.fill();
  if(kind===0){ ctx.beginPath(); ctx.arc(hdx-8,hy-7,4.5,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#8F8A80'; ctx.lineWidth=0.8; ctx.beginPath(); ctx.arc(hdx+4,hy+0,2.6,0,Math.PI*2); ctx.stroke(); }
  if(P.pony){ ctx.beginPath(); ctx.moveTo(hdx-8,hy-5); ctx.quadraticCurveTo(hdx-16,hy,hdx-13,hy+10); ctx.lineTo(hdx-10,hy+2); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='#2A2622'; ctx.beginPath(); ctx.arc(hdx+4.5,hy-1,1,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function shade(hex){ const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.round(v*0.82)); return '#'+[n>>16,(n>>8)&255,n&255].map(f).map(v=>v.toString(16).padStart(2,'0')).join(''); }
function mixWet(hex,w){ const n=parseInt(hex.slice(1),16); const f=v=>Math.round(v*(1-0.4*w)); return 'rgb('+[n>>16,(n>>8)&255,n&255].map(f).join(',')+')'; }

function drawBalcony(S){
  const bw=170,bh=132,bx=10,by=H-bh-12, r=REGI[S.target];

  const wet=G.wet, clearA=G.anim&&G.anim.kind==='clear';
  ctx.save(); ctx.translate(bx,by);
  ctx.fillStyle='#F3EFE4'; ctx.fillRect(-3,-3,bw+6,bh+6); ctx.strokeStyle=C.ink; ctx.lineWidth=1; ctx.strokeRect(-3,-3,bw+6,bh+6);
  ctx.beginPath(); ctx.rect(0,0,bw,bh); ctx.clip();
  // 空
  const cl=Math.max(near*0.85,wet);
  const sky=[156-cl*40,201-cl*70,232-cl*86].map(Math.round);
  ctx.fillStyle='rgb('+sky.join(',')+')'; ctx.fillRect(0,0,bw,bh);
  if(cl<0.6){ ctx.globalAlpha=1-cl/0.6; ctx.fillStyle='#FFE58A'; ctx.beginPath(); ctx.arc(bw-26,22,11+(clearA?3:0),0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
  if(cl>0.2){ ctx.fillStyle='rgba(120,128,134,'+Math.min(0.9,cl)+')';
    [[30,16,22],[62,10,26],[100,18,24],[140,12,28]].forEach(([x,y,rr])=>{ ctx.beginPath(); ctx.ellipse(x,y,rr,10,0,0,Math.PI*2); ctx.fill(); }); }
  // 建物の壁と手すり
  ctx.fillStyle='#CBC4B3'; ctx.fillRect(0,bh-44,bw,44); ctx.fillStyle='#B7AF9C'; ctx.fillRect(0,bh-44,bw,4);
  ctx.strokeStyle='#8D8676'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,bh-56); ctx.lineTo(bw,bh-56); ctx.stroke();
  ctx.lineWidth=1.2; for(let x=6;x<bw;x+=10){ ctx.beginPath(); ctx.moveTo(x,bh-56); ctx.lineTo(x,bh-44); ctx.stroke(); }
  // 物干し竿
  const py=34; ctx.strokeStyle='#7C8B93'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(56,py); ctx.lineTo(bw-4,py); ctx.stroke();
  ctx.fillStyle='#6A6F70'; ctx.fillRect(bw-8,py,4,bh-py);
  // 洗濯物（シャツ・タオル・靴下・子どもの服）
  const sway=Math.sin(G.t*2.2)*(1-wet)*2;
  const shirt=(x,col)=>{ ctx.fillStyle=mixWet(col,wet); ctx.beginPath(); ctx.moveTo(x-12,py+1); ctx.lineTo(x+12,py+1); ctx.lineTo(x+20,py+9); ctx.lineTo(x+14,py+13); ctx.lineTo(x+11,py+10); ctx.lineTo(x+11+sway,py+36); ctx.lineTo(x-11+sway,py+36); ctx.lineTo(x-11,py+10); ctx.lineTo(x-14,py+13); ctx.lineTo(x-20,py+9); ctx.closePath(); ctx.fill(); ctx.fillStyle='rgba(0,0,0,.08)'; ctx.fillRect(x+3,py+10,8,26); };
  shirt(80,'#FFFFFF');
  ctx.fillStyle=mixWet('#9CC8DE',wet); ctx.fillRect(100,py+1,18+sway*0.3,40); ctx.fillStyle=mixWet('#E8F2F7',wet); for(let k=0;k<3;k++) ctx.fillRect(100,py+8+k*11,18,4);
  ctx.fillStyle=mixWet('#F0C64A',wet); ctx.beginPath(); ctx.moveTo(124,py+1); ctx.lineTo(140,py+1); ctx.lineTo(145,py+7); ctx.lineTo(140,py+9); ctx.lineTo(139+sway,py+25); ctx.lineTo(125+sway,py+25); ctx.lineTo(124,py+9); ctx.lineTo(119,py+7); ctx.closePath(); ctx.fill();
  ctx.fillStyle=mixWet('#5B6B8C',wet); ctx.fillRect(149,py+1,5,14); ctx.fillRect(156,py+1,5,12);
  ctx.fillStyle='#E0603A'; [70,90,103,115,127,137,151,158].forEach(x=>ctx.fillRect(x,py-3,2.5,6));
  // しずく
  if(wet>0.2){ ctx.fillStyle='rgba(60,110,170,.75)'; [80,92,108,132,152].forEach((x,k)=>{ const yy=py+38+((G.t*60+k*17)%40); ctx.beginPath(); ctx.ellipse(x,yy,1.4,2.6,0,0,Math.PI*2); ctx.fill(); }); }
  // 人
  drawPerson(STAGES[S.si].person,36,bh-6,0.6+0.4*Math.sin(G.t*1.3)*(1-wet));
  // 雨
  if(wet>0){ ctx.strokeStyle='rgba(70,90,110,'+(0.35+wet*0.4)+')'; ctx.lineWidth=1;
    ctx.beginPath(); for(let k=0;k<40;k++){ const x=(k*37+G.t*90)%(bw+20)-10, y=(k*53+G.t*320)%(bh+20)-10; ctx.moveTo(x,y); ctx.lineTo(x-3,y+9); } ctx.stroke(); }
  ctx.restore();
}
// 小窓の位置（論理座標）。地図の文字はこの枠と見出しに重ねない
function balconyBox(){ const bw=170,bh=132,bx=10,by=H-bh-12; return {bx,by,bw,bh}; }

// 気象庁発表のテロップ（失敗演出）: 画面が雨で暗くなる → 発表文の帯が右から入る
function drawTelopDim(t){
  ctx.fillStyle='rgba(60,66,72,'+(0.45*Math.min(1,t/0.5))+')'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(200,215,230,0.55)'; ctx.lineWidth=1.2; ctx.beginPath();
  for(let k=0;k<90;k++){ const x=(k*53+t*140)%(W+40)-20, y=(k*97+t*900)%(H+40)-20; ctx.moveTo(x,y); ctx.lineTo(x-4,y+14); } ctx.stroke();
}
function drawTelop(S,t){
  const a=Math.min(1,t/0.25), e=1-Math.pow(1-a,3);
  const f=S.fail, r=REGI[f.reg];
  const lines=f.type==='onset'?[r.jname+'は','梅雨入りしたと見られます。']:['前線が停滞し、',r.jname+'で','大雨となっています。'];
  const head=f.type==='onset'?'気象庁発表　梅雨の時期に関する気象情報':'気象庁発表　大雨に関する気象情報';
  const top=topY(), bh=40+lines.length*34, y0=top+Math.max(70,(H-top)*0.3), x0=(1-e)*W;
  ctx.fillStyle='rgba(18,34,68,0.95)'; ctx.fillRect(x0,y0,W,bh);
  ctx.fillStyle='#FBFBF7'; ctx.fillRect(x0,y0,W,2); ctx.fillRect(x0,y0+bh-2,W,2);
  ctx.textAlign='left'; ctx.textBaseline='top';
  const fit=(txt,w,size,min)=>{ ctx.font='800 '+size+'px '+FONT; const m=ctx.measureText(txt).width; return Math.max(min,Math.min(size,size*w/m)); };
  ctx.font='700 '+fit(head,W-36,12,10).toFixed(1)+'px '+FONT; ctx.fillText(head,x0+18,y0+12);
  const fs=Math.min(...lines.map(l=>fit(l,W-36,24,10)));
  ctx.font='800 '+fs.toFixed(1)+'px '+FONT; lines.forEach((l,i)=>ctx.fillText(l,x0+18,y0+36+i*34));
}

function draw(){
  const S=G.S, top=topY();
  if(!S){ ctx.fillStyle=C.sea; ctx.fillRect(0,0,W,H); return; }
  LB=[]; LQ=[]; LMISS=[];
  const play=G.screen!=='title', B=balconyBox();
  drawMap(S,top);
  const lo=drawIsobars(S,top);
  drawHigh(S,top);
  drawFront(S,top);
  drawLowMark(lo,top);
  if(play) drawCityMark(S,top);
  if(lo.x>=-10&&lo.x<=W+10) lbBlock(lo.x-5,lo.y+top-5,lo.x+5,lo.y+top+5,'low-mark');
  // 文字の配置（優先度順）: 見出し → 小窓 → ガイド → 高 → 守る地点 → 梅雨入り・雨量 → 低 → 等圧線の値 → 緯度経度
  const hd='地上天気図 '+dstr(S.day)+' 09時';
  const tw=(t,f)=>{ ctx.font=f; return ctx.measureText(t).width; };
  label({text:hd,font:'700 12.5px '+FONT,h:22,pad:7,bg:'rgba(251,251,247,0.94)',box:C.ink,fg:C.ink,kind:'head',req:true},[[8+tw(hd,'700 12.5px '+FONT)/2+7,top+19]]);
  let guide=null;
  if(play){
    lbBlock(B.bx-4,B.by-4,B.bx+B.bw+4,B.by+B.bh+4,'balcony');
    label({text:PLACES[S.si],font:'700 11px '+FONT,h:16,pad:5,bg:'rgba(251,251,247,0.94)',fg:C.ink,kind:'caption',req:true},[[B.bx-3+tw(PLACES[S.si],'700 11px '+FONT)/2+5,B.by-12]]);
    if(G.guide>0&&!G.anim){ const gx0=B.bx+B.bw+12, gw=W-8-gx0, gy0=B.by+B.bh-58; guide={gx0,gw,gy0,a:Math.min(1,G.guide/0.6)}; lbBlock(gx0,gy0,gx0+gw,gy0+52,'guide'); }
  }
  labelHigh(S,top);
  if(play){ labelCity(S,top); labelOthers(S,top); }
  labelLow(lo,top);
  labelHighRings(S,top);
  for(const q of (S._isoLabels||[])) if(Math.hypot(q[1]-S.hx,q[2]-top-S.hy)>R_DISK+10) label({text:q[0],font:'600 10px '+FONT,h:12,pad:6,bg:C.sea,fg:C.iso,kind:'iso'},[[q[1],q[2]]]);
  labelGrid(S,top,Math.min(ly(16)+top+8,(play?B.by-28:H-10)));
  drawQueued();
  if(play){
    const failing=G.anim&&G.anim.kind==='fail';
    if(failing) drawTelopDim(G.anim.t);
    drawBalcony(S);
    if(guide){ ctx.globalAlpha=guide.a; ctx.fillStyle='rgba(27,42,68,0.9)'; ctx.fillRect(guide.gx0,guide.gy0,guide.gw,52);
      ctx.fillStyle='#FBFBF7'; ctx.textAlign='center'; ctx.textBaseline='middle';
      const l1='どこでもドラッグ', l2='→ 高気圧が動きます';
      ctx.font='700 14px '+FONT; const fs=Math.max(10,Math.min(14,14*(guide.gw-16)/Math.max(ctx.measureText(l1).width,ctx.measureText(l2).width)));
      ctx.font='700 '+fs.toFixed(1)+'px '+FONT; ctx.fillText(l1,guide.gx0+guide.gw/2,guide.gy0+16); ctx.fillText(l2,guide.gx0+guide.gw/2,guide.gy0+36); ctx.globalAlpha=1; }
    if(failing) drawTelop(S,G.anim.t);
  }
  if(G.screen==='play'||G.screen==='pause'){
    const st=STAGES[G.stage]; let mk=null,mv=0; for(const k in S.g) if(S.g[k]>mv){mv=S.g[k];mk=k;}
    const left=Math.max(0,Math.ceil(S.end-S.day));
    let c='あと'+left+'日';
    if(mk&&mv>=40){ const t=REGI[mk].name+' '+Math.round(mv)+'mm'; c+=' '+(mv>GMAX*0.7?'<span class="warn">'+esc(t)+'</span>':esc(t)); }
    UI.hud(REGI[st.r].name,(G.stage+1)+'/'+STAGES.length,c);
  }
  window.__lb={LB:LB.map(r=>r.slice()),miss:LMISS.slice(),top,H};
}

// ---- メインループ ----
function frame(ts){
  const dt=lastTs?Math.min((ts-lastTs)/1000,0.05):0; lastTs=ts;
  if(G.screen==='play') update(dt); else G.t+=dt;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=getComputedStyle(document.body).backgroundColor; ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,TX*DPR,TY*DPR);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip(); draw(); ctx.restore();   // 横長の画面でも地図は論理幅 W の中だけに描く
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize); resize();
showTitle();
requestAnimationFrame(frame);
</script>
